# H96 MAX M9 (RK3576) — WirePlumber 0.5 友好名配置
# 仅重命名（GNOME 设置 → 声音 里的显示名），纯装饰性规则。
# 严禁在此文件中加入 audio.channels / audio.position / api.alsa.* 等
# 任何影响声道数或格式的属性 —— 那会重新引入 64ch mclk 爆炸问题。

monitor.alsa.rules = [
  # ---- 设备级（设备选择器显示名）----
  {
    matches = [ { device.name = "alsa_card.platform-ht5010-sound" } ]
    actions = {
      update-props = {
        device.description = "3.5mm 耳机输出"
        device.nick = "3.5mm 耳机"
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.platform-spdif-tx0-sound" } ]
    actions = {
      update-props = {
        device.description = "SPDIF 数字输出"
        device.nick = "SPDIF"
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.platform-hdmi-sound" } ]
    actions = {
      update-props = {
        device.description = "HDMI 显示器音频"
        device.nick = "HDMI"
      }
    }
  }
  # ---- 节点级（输出设备下拉列表显示名）----
  # 前缀正则同时兼容非 UCM 命名 (playback.0.0) 与 UCM 命名 (HiFi__...__sink)
  {
    matches = [ { node.name = "~alsa_output.platform-ht5010-sound.*" } ]
    actions = {
      update-props = {
        node.description = "3.5mm 耳机输出"
        node.nick = "3.5mm 耳机"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-spdif-tx0-sound.*" } ]
    actions = {
      update-props = {
        node.description = "SPDIF 数字输出"
        node.nick = "SPDIF"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-hdmi-sound.*" } ]
    actions = {
      update-props = {
        node.description = "HDMI 显示器音频"
        node.nick = "HDMI"
      }
    }
  }
]
