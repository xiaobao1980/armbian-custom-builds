SectionDevice."Headphones" {
	Comment "3.5mm 耳机"

	EnableSequence [
		cset "name='HPO MIX DAC1 Switch' on"
		cset "name='HPVOL Playback Switch' on"
		cset "name='HP Playback Switch' on"
	]

	DisableSequence [
		cset "name='HP Playback Switch' off"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackMasterElem "DAC1"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Line" {
	Comment "线路输出 (OUT / LOUT)"

	EnableSequence [
		cset "name='OUT MIXL DAC L1 Switch' on"
		cset "name='OUT MIXR DAC R1 Switch' on"
		cset "name='LOUT MIX DAC L1 Switch' on"
		cset "name='LOUT MIX DAC R1 Switch' on"
		cset "name='OUT Playback Switch' on"
	]

	DisableSequence [
		cset "name='OUT Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
		PlaybackMixerElem "OUT"
		PlaybackMasterElem "DAC1"
	}
}

SectionDevice."Mic" {
	Comment "麦克风 (MIC1)"

	EnableSequence [
		cset "name='RECMIXL BST1 Switch' on"
		cset "name='RECMIXR BST1 Switch' on"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' on"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' on"
		cset "name='ADC Capture Switch' on"
	]

	DisableSequence [
		cset "name='ADC Capture Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId}"
		CaptureMixerElem "IN"
		CaptureMasterElem "ADC"
	}
}
