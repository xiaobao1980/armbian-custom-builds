# Neardi LZ200 (RK3576) Armbian build preset
# 用法: ./compile.sh neardi-lz200   （会自动 source 本文件）
BOARD="neardi-lz200"
BRANCH="vendor"          # vendor = 6.1 BSP kernel (rk-6.1-rkr7.2)，本项目补丁仅针对 vendor
RELEASE="trixie"
BUILD_MINIMAL="no"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT="xfce"   # X11 桌面，配合 rkmpp-mpv 扩展（强制 X11 + 自编译 MPP/RGA/ffmpeg-rockchip）
KERNEL_CONFIGURE="no"

# ===== 扩展 (Armbian extensions) =====
# X11 桌面 (xfce) 的 rkmpp 硬解走 rkmpp-mpv：本扩展强制 X11 + 自编译 MPP/RGA/ffmpeg-rockchip + mpv，
#   并写入 CMA=512M、udev mpp_service/rga 0666、/etc/mpv/mpv.conf hwdec=rkmpp、桌面菜单(rkmpp-mpv 图标)。
# 若以后要 Wayland(GNOME/Panfrost) 再切回 mesa-vpu。
ENABLE_EXTENSIONS="rkmpp-mpv"

# RELEASE/RELEASE 更新版本可改为 trixie 等；如需换发行版直接改 RELEASE
