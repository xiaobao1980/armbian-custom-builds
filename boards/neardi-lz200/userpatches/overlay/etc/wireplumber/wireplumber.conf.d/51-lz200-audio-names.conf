# Neardi LZ200 音频设备友好名称 — WirePlumber 0.5.x 专用
# 适用: Debian 13 trixie (WP 0.5.x) / Ubuntu resolute (WP 0.5.x)
# 安装位置: /etc/wireplumber/wireplumber.conf.d/51-lz200-audio-names.conf
#
# 注意:
#   1) WP 0.5 只认 wireplumber.conf.d/*.conf，不认 main.lua.d/*.lua
#   2) "~" 前缀表示正则，不是 glob！用 * 会静默不匹配（经典坑）
#   3) Device 与 Node 是两套独立规则，只写 node.* 时 Devices 列不会改名
#   4) 声道映射修正：RK platform-*-sound 设备 ALSA 上报 audio.channels=64、
#      Channel Map=aux0,aux1，致 GNOME 声音面板不显示左右声道。板载设备实为标准
#      2ch 立体声，故在输出 node 规则强制 audio.channels=2 / audio.position=FL,FR。

monitor.alsa.rules = [
    # ---------- ES8323 板载 Codec：3.5mm 耳机 ----------
    {
        matches = [ { device.name = "alsa_card.platform-es8388-sound" } ]
        actions = {
            update-props = {
                device.description = "3.5mm 耳机 (ES8323)"
                device.nick        = "3.5mm 耳机"
            }
        }
    }
    {
        matches = [ { node.name = "~alsa_output[.]platform-es8388-sound.*" } ]
        actions = {
            update-props = {
                node.description = "3.5mm 耳机 (ES8323)"
                node.nick        = "3.5mm 耳机"
                priority.driver  = 2000
                priority.session = 2000
                # 修正声道映射：RK platform-sound 上报 aux0,aux1 -> 标准立体声
                audio.channels   = 2
                audio.position   = "FL,FR"
            }
        }
    }
    {
        matches = [ { node.name = "~alsa_input[.]platform-es8388-sound.*" } ]
        actions = {
            update-props = {
                node.description = "板载麦克风 (ES8323)"
                node.nick        = "板载麦克风"
                priority.driver  = 2000
                priority.session = 2000
            }
        }
    }

    # ---------- HDMI 音频输出 ----------
    {
        matches = [ { device.name = "alsa_card.platform-hdmi-sound" } ]
        actions = {
            update-props = {
                device.description = "HDMI 音频输出"
                device.nick        = "HDMI"
            }
        }
    }
    {
        matches = [ { node.name = "~alsa_output[.]platform-hdmi-sound.*" } ]
        actions = {
            update-props = {
                node.description = "HDMI 音频输出"
                node.nick        = "HDMI"
                audio.channels   = 2
                audio.position   = "FL,FR"
            }
        }
    }

    # ---------- DP0 (USB-C) 音频输出 ----------
    {
        matches = [ { node.name = "~alsa_output[.]platform-dp0-sound.*" } ]
        actions = {
            update-props = {
                node.description = "DP (USB-C) 音频输出"
                node.nick        = "DP"
                audio.channels   = 2
                audio.position   = "FL,FR"
            }
        }
    }

    # ---------- USB 声卡（Type-C 扩展坞内置等）----------
    # 不改名，保持系统默认识别名。
    # 4a) 所有 USB 输出统一提优先级：插入时自动接管默认输出，拔出回落 3.5mm
    {
        matches = [ { node.name = "~alsa_output[.]usb-.*" } ]
        actions = { update-props = { priority.driver = 2200  priority.session = 2200 } }
    }
    # 4b) 【条件式】仅当误报 audio.channels=64 时才纠偏为 2ch
    #     （64 = SPA 最大声道数，表示"未知"，会让 GNOME 声音面板不显示左右声道）
    #     加条件是为了不把真正的 5.1/7.1 USB 声卡降级成立体声。
    {
        matches = [ { node.name = "~alsa_output[.]usb-.*"  audio.channels = 64 } ]
        actions = { update-props = {
            priority.driver = 2200  priority.session = 2200
            audio.channels = 2  audio.position = "FL,FR"
        } }
    }
    {
        matches = [ { node.name = "~alsa_input[.]usb-.*" } ]
        actions = { update-props = { priority.driver = 2200  priority.session = 2200 } }
    }
]
