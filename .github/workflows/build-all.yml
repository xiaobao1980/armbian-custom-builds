name: Build All Boards (矩阵)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "armbian/build 引用 (分支/标签, 主线是 main; master 是旧分支)"
        required: false
        default: "main"
        type: string
      boards:
        description: "参与构建的板卡 (逗号分隔, 留空 = 全部)"
        required: false
        default: ""
        type: string

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.gen.outputs.boards }}
    steps:
      - id: gen
        run: |
          ALL='["aio-3288c","h96-m9","h96s","am60-sa12","neardi-lz200"]'
          IN="${{ inputs.boards }}"
          if [ -n "$IN" ]; then
            echo "boards=$(echo "$IN" | tr ',' '\n' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          else
            echo "boards=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.matrix.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 注册 QEMU binfmt (跨架构 arm64 构建必需)
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "原生 arm64 runner, 无需 qemu binfmt"; exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt 2>/dev/null || true
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          if ! ls /proc/sys/fs/binfmt_misc/ | grep -qi 'aarch64'; then
            echo "apt 注册失败, 改用 tonistiigi/binfmt 兜底"
            docker run --privileged --rm tonistiigi/binfmt --install arm64,arm
          fi
          echo "--- binfmt_misc 已注册:"; ls /proc/sys/fs/binfmt_misc/

      - name: Clone armbian/build (${{ inputs.build_ref }})
        run: |
          git clone --depth=1 --branch "${{ inputs.build_ref }}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件
        run: bash scripts/sync-board-to-build.sh "${{ matrix.board }}" armbian-build

      - name: 组装构建参数
        id: args
        run: |
          # shellcheck disable=SC1091
          source "boards/${{ matrix.board }}/build.env"
          ARGS="BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} BUILD_DESKTOP=${BUILD_DESKTOP} BUILD_MINIMAL=${BUILD_MINIMAL}"
          if [ -n "${ENABLE_EXTENSIONS:-}" ]; then ARGS="${ARGS} ENABLE_EXTENSIONS=${ENABLE_EXTENSIONS}"; fi
          # BUILD_DESKTOP=yes 必须显式给桌面环境和档位, 否则弹 dialog(无 TTY 直接挂)
          if [ "${BUILD_DESKTOP}" = "yes" ]; then
            if [ -z "${DESKTOP_ENVIRONMENT:-}" ]; then echo "::error::BUILD_DESKTOP=yes 但 DESKTOP_ENVIRONMENT 为空"; exit 1; fi
            ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DESKTOP_ENVIRONMENT}"
            if [ -n "${DESKTOP_TIER:-}" ]; then ARGS="${ARGS} DESKTOP_TIER=${DESKTOP_TIER}"; fi
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "构建参数: ${ARGS}"

      - name: 编译镜像
        run: |
          cd armbian-build
          # main 分支 CLI 参数顺序任意, 保持 KEY=VALUE 在前更可读
          ./compile.sh \
            ${{ steps.args.outputs.args }} \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            DOWNLOAD_MIRROR=china \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            build

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*.xz
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 14
