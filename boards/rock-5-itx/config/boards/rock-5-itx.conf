# ↓↓ 本仓板级开机定制（上游没有这段；已在文件头「本地改动清单」登记）↓↓
# =============================================================================

# vendor 内核的调试串口是 fiq_debugger 的 ttyFIQ0，但 config/bootscripts/boot-rk35xx.cmd
# 在 `env import armbianEnv.txt` **之前** 就 setenv serialcon "ttyS2"，而
# config/bootenv/rk35xx.txt 模板里根本没有 serialcon 键（只有 console=both / extraargs=cma=256M）。
# 净结果：bootargs 里永远是这块板上不存在的 console=ttyS2,1500000 —— 串口拿不到任何输出。
# 上游 family 的 post_family_config__900_late_default_serial_console_by_branch 虽然把
# SERIALCON 设成 ttyFIQ0，但那个变量进不了 armbianEnv.txt（模板没这个键），只在 getty 那侧生效。
# 这里直接把键补进镜像的 armbianEnv.txt。
#
# ⚠️ 只写 serialcon，绝不写 extraboardargs：那是 rkmpp-mpv 扩展写 cma=512M 的键。
#    boot 脚本对同名键按最后一次取值，两处写等于互相吃参数（本仓在 CMA 上踩过一次）。
function post_family_tweaks__rock5itx_serial_console() {
	[[ "${BRANCH}" == vendor* ]] || return 0
	local env_file="${SDCARD}/boot/armbianEnv.txt"
	if [[ ! -f "${env_file}" ]]; then
		display_alert "$BOARD" "armbianEnv.txt 尚未生成，跳过 serialcon 设置（开机后手动确认串口参数）" "warn"
		return 0
	fi
	if grep -qE '^serialcon=' "${env_file}"; then
		display_alert "$BOARD" "armbianEnv.txt 已有 serialcon 键，保持不动" "info"
		return 0
	fi
	printf 'serialcon=ttyFIQ0\n' >> "${env_file}"
	display_alert "$BOARD" "vendor 串口: serialcon=ttyFIQ0 已写入 /boot/armbianEnv.txt" "info"
}

# =============================================================================
# ↓↓ 无线自检（本仓新增；硬件事实：Radxa Wireless Module A8 = Realtek RTL8852BE）↓↓
#
#   · Wi-Fi 走 **PCIe** → 内核树内 rtw88（rtw88_core + rtw88_pci + rtw88_8852be）；
#     Realtek 外置驱动版叫 8852be.ko，两种命名都查。
#   · 蓝牙走 **USB** → btusb，固件在 /lib/firmware/rtl_bt/。
#     ⚠️ 所以本板**不需要 BT_UART**，别照搬 am60-sa12 / h96s 那套 UART 蓝牙（btport）路子。
#
# 本 hook 不改镜像内容，只在构建期把「镜像里到底有没有对应 .ko 与固件」写进日志。
# 时序（上游 lib/functions/main/rootfs-image.sh）：install_distribution_specific（内核）与
# install_distribution_agnostic（含 armbian-firmware，distro-agnostic.sh:443-450）都跑在
# customize_image（post_family_tweaks 所在阶段）**之前**，所以这里看到的是最终态，不是半成品。
# 固件默认是精简版 armbian-firmware；若这里报缺 blob，正解是在本板 build.env 加
#   BOARD_FIRMWARE_INSTALL="-full"      # 换成 armbian-firmware-full（整棵 linux-firmware）
# 而不是等烧卡后用 apt 补。
#   缺 .ko → vendor 内核没编 rtw88，得动内核配置，烧卡也救不回来；
#   缺固件 → 装完扫不到 WiFi/BT。
#
# 实现约束（本仓踩过的坑）：一律不用 `find | head -1` / `find | grep -q` —— 框架全局
# set -Eeuo pipefail，head/grep 提前退出会让 find 吃 SIGPIPE，pipefail 把「其实找到了」
# 判成失败。改成把 find 全部输出收进变量、用 [[ -n ]] 判断，无管道、无 SIGPIPE。
function post_family_tweaks__rock5itx_wireless_check() {
	[[ "${BRANCH}" == "vendor" ]] || return 0

	local kroot="${SDCARD}/usr/lib/modules"
	if [[ ! -d "${kroot}" ]]; then
		display_alert "$BOARD" "RTL8852BE 自检跳过：镜像里没有内核模块树（${kroot}）" "warn"
		return 0
	fi

	local ko hit rel drv_found=no
	for ko in rtw88_8852be 8852be; do
		hit="$(find "${kroot}" -name "${ko}.ko*" 2>/dev/null || true)"
		if [[ -n "${hit}" ]]; then
			rel="${hit#"$kroot"/}"
			rel="${rel%%$'\n'*}"
			display_alert "$BOARD" "RTL8852BE Wi-Fi 驱动: 找到 ${ko}.ko -> ${rel}" "info"
			drv_found=yes
		fi
	done
	[[ "${drv_found}" == "yes" ]] || \
		display_alert "$BOARD" "RTL8852BE Wi-Fi 驱动: 内核树里没有 rtw88_8852be/8852be.ko —— WiFi 起不来，需确认 vendor 内核 CONFIG_RTW88_8852BE" "warn"

	local fw fw_found=no
	for fw in rtw8852be_fw.bin rtl8852be_config.bin rtl8852be_fw.bin; do
		hit="$(find "${SDCARD}/lib/firmware" -name "${fw}" 2>/dev/null || true)"
		if [[ -n "${hit}" ]]; then
			rel="${hit#"$SDCARD"}"
			rel="${rel%%$'\n'*}"
			display_alert "$BOARD" "RTL8852BE 固件 ${fw}: ${rel}" "info"
			fw_found=yes
		else
			display_alert "$BOARD" "RTL8852BE 固件 ${fw}: 镜像里没有 —— 本板 build.env 加 BOARD_FIRMWARE_INSTALL=\"-full\" 换 armbian-firmware-full" "warn"
		fi
	done
	[[ "${fw_found}" == "yes" ]] || \
		display_alert "$BOARD" "RTL8852BE: 三个固件 blob 全缺，本板无线/蓝牙在镜像里不可用" "warn"

	return 0
}
