# Neardi LZ200 (RK3576) Armbian build preset
# 用法: ./compile.sh neardi-lz200   （会自动 source 本文件）
BOARD="neardi-lz200"
BRANCH="vendor"          # vendor = 6.1 BSP kernel (rk-6.1-rkr7.2)，本项目补丁仅针对 vendor
RELEASE="trixie"
BUILD_MINIMAL="no"
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT="xfce"   # X11 桌面，配合 rkmpp-mpv 扩展（强制 X11 + 自编译 MPP/RGA/ffmpeg-rockchip）
KERNEL_CONFIGURE="no"

# ===== 扩展 (Armbian extensions) =====
# 与 build.env 保持一致：rkmpp-mpv 与 chromium-rkmpp **互不排斥**，各管一件事，
# 由扩展按「实际」RELEASE + 桌面自己判定是否执行：
#   rkmpp-mpv      → 本地播放（自编译 MPP/RGA/ffmpeg-rockchip + mpv，非 jammy）
#   chromium-rkmpp → 网页视频（PPA 的 chromium +rkmpp，仅 jammy|noble）
# 本 preset 是 trixie + xfce（X11）→ 实际生效的是 rkmpp-mpv：强制 X11 + 自编译
#   MPP/RGA/ffmpeg-rockchip + mpv，并写 CMA=512M、udev mpp_service/rga 0666、
#   /etc/mpv/mpv.conf hwdec=rkmpp、桌面菜单（rkmpp-mpv 图标）；chromium-rkmpp 自动跳过
#   （Debian 侧 chromium 无 V4L2 VDA patch，网页视频只能软解）。
# rk35xx-chinese-desktop：中文桌面通用设置（XFCE/X11 → fcitx5-rime + 雾凇拼音）。
# ⚠️ 如果改了 RELEASE/桌面却忘了这里，会与 build.env 不一致（本文件用于本地
#    ./compile.sh neardi-lz200 的 preset 路径），两处务必同步。
ENABLE_EXTENSIONS="rkmpp-mpv,chromium-rkmpp,rk35xx-chinese-desktop"

# RELEASE/RELEASE 更新版本可改为 trixie 等；如需换发行版直接改 RELEASE
