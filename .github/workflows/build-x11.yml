name: Build Armbian Image (X11 定制版)

# =============================================================================
#  X11 定制版 —— 与 build-image.yml（标准版）并存，互不影响
# -----------------------------------------------------------------------------
#  固定策略（评测点，不可覆盖）：
#    · 桌面必须是 X11：DESKTOP_ENVIRONMENT 只给 xfce/cinnamon/mate/lxqt/i3-wm
#    · 硬解栈走 rkmpp-mpv（mpv + ffmpeg-rockchip，drm_prime 零拷贝，X11 专用）
#    · 网页硬解走 chromium-rkmpp（PPA + pin1002 + chromium 132/126+rkmpp；仅 jammy/noble）
#      两个扩展互不排斥，同时启用即「本地 4K 零拷贝 + 网页视频硬解」同一镜像。
#    · 显示管理器按 X11 会话配置（gdm3 → WaylandEnable=false）
#  可配置：板卡 / 发行版 / 桌面 / 默认用户（用户名·密码·root 密码·附加组·
#          sudo 免密·桌面自动登录）/ 中文环境 / 压缩格式 / runner / 是否发 Release
#
#  默认用户由 common/extensions/default-user.sh 在**构建期**建好（chroot 内），
#  不依赖首启 rc.local 时序：烧卡后开机即可直接登录桌面（自动登录可关）。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      board:
        description: "板卡"
        type: choice
        required: true
        default: neardi-lz200
        options:
          - neardi-lz200
          - h96s
          - am60-sa12
          - aio-3288c

      release:
        description: "发行版 (default=跟随板卡; X11 硬解栈首选 trixie, 预编译 deb 只匹配 trixie)"
        type: choice
        required: false
        default: default
        options:
          - default
          - trixie
          - noble
          - bookworm
          - jammy

      desktop_environment:
        description: "X11 桌面环境 (Wayland 桌面请用 Wayland 定制版)"
        type: choice
        required: false
        default: xfce
        options:
          - xfce
          - cinnamon
          - mate
          - lxqt
          - i3-wm

      desktop_tier:
        description: "桌面软件档位 (minimal=仅桌面 / mid=+浏览器媒体 / full=+办公开发)"
        type: choice
        required: false
        default: mid
        options:
          - minimal
          - mid
          - full

      user_name:
        description: "默认用户名 (小写字母/数字/下划线/连字符; 留空=不创建默认用户)"
        type: string
        required: false
        default: xiaobao

      user_password:
        description: "默认用户密码 (仅允许 A-Za-z0-9 . _ + # = : @ % -，4~64 位)"
        type: string
        required: false
        default: "123456"

      root_password:
        description: "root 密码 (留空=不改 root 密码; 字符集同用户密码)"
        type: string
        required: false
        default: "123456789"

      user_groups:
        description: "附加组 (逗号分隔, 不存在的组自动跳过)"
        type: string
        required: false
        default: "sudo,adm,audio,video,plugdev,netdev,render,input,dialout,cdrom"

      sudo_nopasswd:
        description: "该用户 sudo 免密"
        type: boolean
        required: false
        default: true

      desktop_autologin:
        description: "桌面自动登录该用户 (烧卡后开机直接进桌面)"
        type: boolean
        required: false
        default: true

      chinese:
        description: "中文环境 (所有发行版默认开启: locale/时区/字体/输入法/Chromium 中文化/AccountsService 会话语言; 仅 rk35xx vendor 内核生效)"
        type: boolean
        required: false
        default: true

      compress:
        description: "镜像压缩格式"
        type: choice
        required: false
        default: xz
        options:
          - xz
          - 7z
          - none

      build_ref:
        description: "armbian/build 引用 (分支/标签; 主线是 main)"
        type: string
        required: false
        default: "main"

      runner:
        description: "运行器 (arm64 板选 ubuntu-24.04-arm 可原生编译, 免 qemu 且更快)"
        type: choice
        required: false
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest

      kernel_uboot_mode:
        description: "内核 + U-Boot 构件来源 (reuse=复用历史已编译 debs; fresh=不用历史 debs, 源码全新编译, rootfs 仍复用; fresh-strict=连 rootfs/远程 OCI 也全部禁用, 最慢)"
        type: choice
        required: false
        default: reuse
        options:
          - reuse
          - fresh
          - fresh-strict

      cache_tag:
        description: "指定历史缓存基线: 填构建 run number (Release 里的 r17 -> 填 17); 留空 = 自动选最新一次"
        type: string
        required: false
        default: ""

      save_cache:
        description: "把本次编译产物存成新的历史基线 (供以后 reuse / cache_tag 选用)"
        type: boolean
        required: false
        default: true

      publish_release:
        description: "构建成功后发布到 GitHub Releases"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # 340 而不是 360: GitHub job 硬上限就是 360 分钟，撞线会被杀在
    # artifact / 日志上传中途（产物丢失、Release 半截）。留 20 分钟给收尾。
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须最先执行：GitHub 会在每个 step 开头回显 env，而 add-mask 只有在
      # 「值已经带掩码」之后才生效。这里从事件载荷里取密码（不进 run 脚本文本、
      # 不进 env 回显），立刻加掩码，后续所有 step 的 env 回显都会显示成 ***。
      - name: 注册密码掩码 (先于任何 env 回显, 避免明文进日志)
        run: |
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; return 0; fi; return 0; }
          # 掩码是"尽力而为"的兜底：读不到 event JSON 或缺 jq 时以前会静默跳过，
          # 于是"以为已掩码"的后续步骤照旧把明文写进日志。现在显式告警。
          # （真正的防线是：口令只在 0600 凭据文件里走，编译步骤的 env 已不再带口令。）
          if [ ! -r "${GITHUB_EVENT_PATH:-/dev/null}" ]; then
            echo "::warning::读不到 event JSON，密码掩码未注册（本 workflow 的口令只走凭据文件，不进 env/日志）"
          elif ! command -v jq >/dev/null 2>&1; then
            echo "::warning::无 jq，密码掩码未注册（同上，口令不依赖 env 通道）"
          else
            mask "$(jq -r '.inputs.user_password // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            mask "$(jq -r '.inputs.root_password // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            echo "密码掩码已注册"
          fi

      - name: Free disk space (构建需要 ~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 注册 QEMU binfmt (跨架构 arm64/armhf 构建必需)
        env:
          IN_BOARD: ${{ inputs.board }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ] && [ "${IN_BOARD}" != "aio-3288c" ]; then
            echo "原生 arm64 runner + arm64 目标, 无需 qemu binfmt"
            exit 0
          fi
          # 用 docker/tonistiigi/binfmt 注册, 自带 fix-binary(F) 标志, chroot 容器内也能用。
          # 不再走 apt 装 qemu-user-static —— 新版 GitHub runner 镜像里该包已无安装候选,
          # 会直接 'E: Package qemu-user-static has no installation candidate' 退出码 100 失败。
          # 注: arm64 runner 上构建 aio-3288c(32 位 arm) 时, 只注册 arm, 避免污染原生 aarch64。
          PLAT=arm64,arm
          [ "$(uname -m)" = "aarch64" ] && PLAT=arm
          docker run --privileged --rm tonistiigi/binfmt --install "$PLAT"
          echo "--- binfmt_misc 已注册:"
          ls /proc/sys/fs/binfmt_misc/

      - name: Clone armbian/build (${{ inputs.build_ref }})
        env:
          BUILD_REF: ${{ inputs.build_ref }}
        run: |
          set -euo pipefail
          # build_ref 是自由文本，原样内插进 run: 就是一条以 runner 令牌执行的命令，
          # 故一律先落 env 再引用。
          [ -n "${BUILD_REF}" ] || { echo "::error::build_ref 为空"; exit 1; }
          git clone --depth=1 --branch "${BUILD_REF}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件 (仅该板卡, 互不干扰)
        env:
          IN_BOARD: ${{ inputs.board }}
        run: bash scripts/sync-board-to-build.sh "${IN_BOARD}" armbian-build

      - name: 计算构件缓存键 (kernel/u-boot 与 rootfs 分离)
        id: cache-key
        env:
          IN_BOARD: ${{ inputs.board }}
          IN_REL: ${{ inputs.release }}
          IN_DE: ${{ inputs.desktop_environment }}
          IN_TIER: ${{ inputs.desktop_tier }}
          IN_REF: ${{ inputs.build_ref }}
          IN_TAG: ${{ inputs.cache_tag }}
          KU_HASH: ${{ hashFiles(format('boards/{0}/userpatches/kernel/**', inputs.board), format('boards/{0}/userpatches/u-boot/**', inputs.board), format('boards/{0}/config/**', inputs.board), format('boards/{0}/build.env', inputs.board)) }}
          ROOTFS_HASH: ${{ hashFiles('common/extensions/**', 'scripts/**', format('boards/{0}/userpatches/overlay/**', inputs.board)) }}
        run: |
          set -euo pipefail
          [[ "${IN_TAG}" =~ ^[0-9]+$ || -z "${IN_TAG}" ]] \
            || { echo "::error::cache_tag 只能是构建 run number (纯数字), 收到 '${IN_TAG}'"; exit 1; }
          REF="${IN_REF//\//_}"
          PREFIX="armbian-x11"
          DEBS_BASE="${PREFIX}-debs-${IN_BOARD}-${IN_REL}-${IN_DE}-${REF}-${KU_HASH}-v2"
          ROOTFS_BASE="${PREFIX}-rootfs-${IN_BOARD}-${IN_REL}-${IN_DE}-${IN_TIER}-${REF}-${ROOTFS_HASH}-v2"
          SUFFIX="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          if [ -n "${IN_TAG}" ]; then
            DEBS_RESTORE="${DEBS_BASE}-r${IN_TAG}-a1"
            ROOTFS_RESTORE="${ROOTFS_BASE}-r${IN_TAG}-a1"
          else
            DEBS_RESTORE="${DEBS_BASE}-auto"
            ROOTFS_RESTORE="${ROOTFS_BASE}-auto"
          fi
          {
            echo "debs_restore=${DEBS_RESTORE}"
            echo "debs_save=${DEBS_BASE}-${SUFFIX}"
            echo "rootfs_restore=${ROOTFS_RESTORE}"
            echo "rootfs_save=${ROOTFS_BASE}-${SUFFIX}"
            echo "tag=${IN_TAG}"
            echo "debs_restore_keys<<DEBS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${DEBS_BASE}-r${IN_TAG}-"; fi
            echo "${DEBS_BASE}-"
            echo "DEBS_EOF"
            echo "rootfs_restore_keys<<ROOTFS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${ROOTFS_BASE}-r${IN_TAG}-"; fi
            echo "${ROOTFS_BASE}-"
            echo "ROOTFS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "kernel/u-boot 缓存基线: ${DEBS_BASE}-"
          echo "rootfs 缓存基线       : ${ROOTFS_BASE}-"
          echo "本次保存为            : ...-${SUFFIX}  (以后 cache_tag 填 ${GITHUB_RUN_NUMBER} 即可精确复用)"

      - name: 恢复历史 kernel/u-boot debs (reuse 模式)
        id: debs-cache
        if: ${{ inputs.kernel_uboot_mode == 'reuse' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.debs_restore_keys }}

      - name: 恢复 rootfs 缓存
        id: rootfs-cache
        if: ${{ inputs.kernel_uboot_mode != 'fresh-strict' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.rootfs_restore_keys }}

      - name: 校验指定的历史缓存基线
        if: ${{ inputs.cache_tag != '' }}
        env:
          IN_TAG: ${{ inputs.cache_tag }}
          DEBS_MATCHED: ${{ steps.debs-cache.outputs.cache-matched-key }}
          ROOTFS_MATCHED: ${{ steps.rootfs-cache.outputs.cache-matched-key }}
          MODE: ${{ inputs.kernel_uboot_mode }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "reuse" ] && [[ "${DEBS_MATCHED}" != *"-r${IN_TAG}-"* ]]; then
            echo "::error::指定的历史基线 r${IN_TAG} 未命中 (实际: ${DEBS_MATCHED:-无})。请留空 cache_tag 用自动最新，或从以往构建日志里挑一个真实的 run number。"
            exit 1
          fi
          echo "历史基线 r${IN_TAG}: debs='${DEBS_MATCHED:-未恢复(fresh)}' rootfs='${ROOTFS_MATCHED:-无}'"

      - name: "全新编译模式: 清空历史 kernel/u-boot debs"
        if: ${{ inputs.kernel_uboot_mode != 'reuse' }}
        env:
          MODE: ${{ inputs.kernel_uboot_mode }}
        run: |
          set -euo pipefail
          mkdir -p armbian-build/output/debs
          n=$(find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f | wc -l)
          find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f -delete
          echo "::notice::已跳过历史 debs 缓存并清空 ${n} 个文件, kernel/u-boot 将从源码编译"
          if [ "${MODE}" = "fresh-strict" ]; then
            echo "::notice::fresh-strict: 额外传 ARTIFACT_IGNORE_CACHE=yes, 连 rootfs 与远程 OCI 缓存也全部禁用 (最慢)"
          else
            echo "::notice::fresh: rootfs 缓存仍复用, 只有 kernel/u-boot 全新编译"
          fi

      - name: 校验用户设置 + 组装构建参数
        id: args
        env:
          IN_BOARD: ${{ inputs.board }}
          IN_REL: ${{ inputs.release }}
          IN_DE: ${{ inputs.desktop_environment }}
          IN_TIER: ${{ inputs.desktop_tier }}
          IN_USER: ${{ inputs.user_name }}
          IN_UPASS: ${{ inputs.user_password }}
          IN_RPASS: ${{ inputs.root_password }}
          IN_GROUPS: ${{ inputs.user_groups }}
          IN_CHINESE: ${{ inputs.chinese }}
          IN_COMPRESS: ${{ inputs.compress }}
        run: |
          set -euo pipefail

          # ---- 1. 板卡默认值 ----
          BE="boards/${IN_BOARD}/build.env"
          [ -f "$BE" ] || { echo "::error::找不到 $BE"; exit 1; }
          set -a; source "$BE"; set +a

          # ---- 2. 用户设置校验（字符集白名单，防止污染 compile.sh 参数）----
          # 二次掩码兜底：第一步从 event JSON 取不到值（无 jq / 不可读）时这里仍能补上。
          # 空值必须跳过 —— `::add-mask::` 后面留空会让 runner 报无值命令，
          # 而且「掩一个空串」等于给日志里所有位置盖掩码。
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; return 0; fi; return 0; }
          mask "${IN_UPASS}"
          mask "${IN_RPASS}"

          if [ -n "${IN_USER}" ]; then
            [[ "${IN_USER}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] \
              || { echo "::error::user_name 非法: '${IN_USER}'（要求 ^[a-z_][a-z0-9_-]{0,31}$）"; exit 1; }
            case "${IN_USER}" in
              root|daemon|bin|sys|nobody|admin) echo "::error::user_name '${IN_USER}' 是系统保留名"; exit 1 ;;
            esac
            [[ "${IN_UPASS}" =~ ^[A-Za-z0-9._+#=:@%-]{4,64}$ ]] \
              || { echo "::error::user_password 字符集受限（只允许 A-Za-z0-9 . _ + # = : @ % -，4~64 位）"; exit 1; }
          fi
          if [ -n "${IN_RPASS}" ]; then
            [[ "${IN_RPASS}" =~ ^[A-Za-z0-9._+#=:@%-]{4,64}$ ]] \
              || { echo "::error::root_password 字符集受限（同 user_password 规则）"; exit 1; }
          fi
          if [ -n "${IN_GROUPS}" ]; then
            [[ "${IN_GROUPS}" =~ ^[A-Za-z0-9_,]*$ ]] \
              || { echo "::error::user_groups 非法（只允许字母数字下划线与逗号）"; exit 1; }
          fi

          # ---- 3. 合并 final 值 ----
          pick() { [ -n "$2" ] && [ "$2" != "default" ] && printf '%s' "$2" || printf '%s' "$1"; }
          REL_FINAL="$(pick "${RELEASE}" "${IN_REL}")"
          DE_FINAL="${IN_DE}"
          TIER_FINAL="${IN_TIER}"
          BRANCH_FINAL="${BRANCH}"

          # ---- 4. 扩展合并（保留板级扩展，再补本流程需要的）----
          EXT="${ENABLE_EXTENSIONS:-}"
          add_ext() { case ",${EXT}," in *",$1,"*) ;; *) EXT="${EXT:+${EXT},}$1" ;; esac; }
          # default-user 的启用条件与凭据步骤保持一致：用户名**或** root 口令任一非空。
          # 只看用户名的话，「user_name 空 + root_password 非空」写出了
          # .default-user.env 却没有扩展来读它（除非恰好也开了中文扩展）。
          { [ -n "${IN_USER}" ] || [ -n "${IN_RPASS}" ]; } && add_ext default-user
          [ "${IN_CHINESE}" = "true" ] && add_ext rk35xx-chinese-desktop
          add_ext rkmpp-mpv
          add_ext chromium-rkmpp
          # 兜底补 display-manager.service：chroot 里 deb-systemd-helper 只建 .wants，
          # 不建这个 Alias → gdm/gnome 路线会停在文字控制台（187 实测，见扩展头注释）
          add_ext desktop-dm
          # 蓝牙音频设备开机自动回连（BlueZ 不会主动连 A2DP/HFP，188 板冷启动实测）
          add_ext bluetooth-autoconnect
          # 每次开机强制 NTP 校时（无 RTC 电池板上电时间归零，chrony/timesyncd 渐进同步不够）
          add_ext ntp-boot-sync
          # 构建时去除 DTB 写死 MAC，让 RK 厂商内核从 efuse/cpuid 派生每板唯一 MAC
          add_ext dtb-no-mac

          # ---- 5. 压缩格式 ----
          case "${IN_COMPRESS}" in
            7z)   COMPRESS="sha,img,7z" ;;
            none) COMPRESS="sha,img"    ;;
            *)    COMPRESS="sha,img,xz" ;;
          esac

          # ---- 6. 硬解栈组合（无需开关）----
          # rkmpp-mpv（mpv 自编译，X11 零拷贝）与 chromium-rkmpp（chrome 网页硬解）互不排斥：
          # 后者只碰 apt 源与 chromium，不做整机 dist-upgrade，不动 mpv 依赖的系统库。
          # 可用性边界：mpv 0.41 需 libplacebo >= 6.338.2（trixie/noble ✓，jammy/bookworm ✗）；
          # chromium+rkmpp 只在 jammy/noble 的 PPA。故 noble = 两件事都有，trixie = 只有 mpv。
          ARGS="BOARD=${BOARD} BRANCH=${BRANCH_FINAL} RELEASE=${REL_FINAL}"
          ARGS="${ARGS} BUILD_DESKTOP=yes BUILD_MINIMAL=no"
          ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DE_FINAL} DESKTOP_TIER=${TIER_FINAL}"
          ARGS="${ARGS} ENABLE_EXTENSIONS=${EXT}"
          # default-user 在 chroot 里 useradd -m 建的家目录，会被框架的
          # create_image_from_sdcard_rootfs 用 --exclude="/home/*" 丢掉
          # （lib/functions/image/rootfs-to-image.sh:38），镜像里只剩空 /home，
          # 用户能自动登录但 $HOME 不存在（profile-sync-daemon / 语言保存全失败）。
          # 显式 INCLUDE_HOME_DIR=yes 才会把 /home/<user> 连同 /etc/skel 打进镜像。
          ARGS="${ARGS} INCLUDE_HOME_DIR=yes"

          {
            echo "args=${ARGS}"
            echo "board=${BOARD}"
            echo "compress=${COMPRESS}"
            echo "release=${REL_FINAL}"
            echo "desktop=${DE_FINAL}"
            echo "branch=${BRANCH_FINAL}"
            echo "extensions=${EXT}"
          } >> "$GITHUB_OUTPUT"

          echo "构建参数: ${ARGS}"

      # 为什么要单独写文件：compile.sh 以非 root 启动时会 `exec sudo --preserve-env
      # <白名单>` 重启自己（lib/functions/cli/utils-cli.sh），普通 env 全被丢弃 ——
      # 只靠 step 的 env: 传 DEFAULT_USER_NAME，扩展读到时是空的，会静默跳过建用户。
      # 文件通道不进 CLI 参数（不污染日志/进程列表），扩展读取后立刻删除。
      - name: 准备构建期用户凭据 (文件通道, 规避 sudo 环境白名单)
        # ⚠️ 门控条件不能只看 user_name：.rk-cn-pass.env 里的 RK_CN_ROOT_PASS 与
        # user_name 无关（rk35xx-chinese-desktop 自己建用户，server 镜像也走它）。
        # 以前 `if: user_name != ''` 让「留空用户名、只填 root 密码」的用法整步跳过 →
        # root 密码静默不生效（扩展已取消内置弱口令兜底，留空即不设口令）。
        # 现在：用户名或 root 密码任一非空就进来，内部再按项分支。
        if: ${{ inputs.user_name != '' || inputs.root_password != '' }}
        env:
          IN_USER: ${{ inputs.user_name }}
          IN_UPASS: ${{ inputs.user_password }}
          IN_RPASS: ${{ inputs.root_password }}
          IN_GROUPS: ${{ inputs.user_groups }}
          IN_NOPASSWD: ${{ inputs.sudo_nopasswd }}
          IN_AUTOLOGIN: ${{ inputs.desktop_autologin }}
        run: |
          set -euo pipefail
          DEST="armbian-build/userpatches/.default-user.env"
          mkdir -p "$(dirname "${DEST}")"
          umask 077
          : > "${DEST}"
          # 用户名非空：整套用户键都写；用户名留空则只写 root 口令一行 ——
          # 扩展侧 _default_user_enabled 现在同时认 DEFAULT_USER_NAME 与 DEFAULT_ROOT_PASSWORD，
          # 于是「user_name 空 + root_password 非空」也能真正落地（以前整步被
          # `if: inputs.user_name != ''` 门控跳过，root 口令静默丢失）。
          if [ -n "${IN_USER}" ]; then
            {
              printf 'DEFAULT_USER_NAME=%q\n' "${IN_USER}"
              printf 'DEFAULT_USER_PASSWORD=%q\n' "${IN_UPASS}"
              printf 'DEFAULT_USER_SHELL=%q\n' "/bin/bash"
              printf 'DEFAULT_DESKTOP_SESSION_TYPE=%q\n' "x11"
              if [ "${IN_NOPASSWD}" = "true" ]; then
                printf 'DEFAULT_SUDO_NOPASSWD=%q\n' "yes"
              else
                printf 'DEFAULT_SUDO_NOPASSWD=%q\n' "no"
              fi
              if [ "${IN_AUTOLOGIN}" = "true" ]; then
                printf 'DEFAULT_DESKTOP_AUTOLOGIN=%q\n' "yes"
              else
                printf 'DEFAULT_DESKTOP_AUTOLOGIN=%q\n' "no"
              fi
              if [ -n "${IN_GROUPS}" ]; then
                printf 'DEFAULT_USER_GROUPS=%q\n' "${IN_GROUPS}"
              fi
            } >> "${DEST}"
          fi
          if [ -n "${IN_RPASS}" ]; then
            printf 'DEFAULT_ROOT_PASSWORD=%q\n' "${IN_RPASS}" >> "${DEST}"
          fi
          if [ -s "${DEST}" ]; then
            chmod 600 "${DEST}"
          else
            rm -f "${DEST}"
            echo "::notice::user_name 与 root_password 均为空：不写 .default-user.env（扩展零副作用）"
          fi

          # rk35xx-chinese-desktop 读的是 RK_CN_* 而非 DEFAULT_*，同样必须走文件通道：
          # 只靠本步骤之外的 step env: 传口令，会被 sudo --preserve-env 白名单丢弃，
          # 扩展侧于是静默烧进内置弱口令（本次修复的根因）。留空的项不写。
          CN_DEST="armbian-build/userpatches/.rk-cn-pass.env"
          : > "${CN_DEST}"
          if [ -n "${IN_USER}" ]; then
            printf 'RK_CN_USER=%q\n' "${IN_USER}" >> "${CN_DEST}"
          fi
          if [ -n "${IN_UPASS}" ]; then
            printf 'RK_CN_USER_PASS=%q\n' "${IN_UPASS}" >> "${CN_DEST}"
          fi
          if [ -n "${IN_RPASS}" ]; then
            printf 'RK_CN_ROOT_PASS=%q\n' "${IN_RPASS}" >> "${CN_DEST}"
          fi
          # 全空输入不留空文件：扩展 source 空文件是无操作，但删掉更干净、
          # 也不会让后面的清理步骤误以为有凭据落地过。
          [ -s "${CN_DEST}" ] || rm -f "${CN_DEST}"
          chmod 600 "${CN_DEST}" 2>/dev/null || true
          # 只报【键名】，绝不回显值（值就是口令本身，日志不受 GitHub 掩码保护）。
          # 现场排障最常问的是「root 口令到底进没进构建」，看这一行就有答案。
          keys_only() {
            if [ ! -s "$1" ]; then printf '（未写入）'; return 0; fi
            cut -d= -f1 "$1" | paste -sd, -
          }
          K_DEFAULT="$(keys_only "${DEST}")"
          K_CN="$(keys_only "${CN_DEST}")"
          echo "::notice::凭据文件（0600，扩展读后即删）.default-user.env[${K_DEFAULT}] .rk-cn-pass.env[${K_CN}]"

      # 预编译包只对「编译它的发行版」有效，因此必须等 args 步骤把最终 RELEASE 解析
      # 出来再选 tag（原先固定先下 trixie 包，noble 板卡拿到跨发行版包 = 等于没拿，
      # 扩展回退源码编译 → 6h 超时风险原封不动回来）。
      - name: 预拉 rkmpp-stack 预编译包 (避免 CI 6h 上限内编不完)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IN_RELEASE: ${{ steps.args.outputs.release }}
        run: bash scripts/fetch-prebuilt-rkmpp.sh "${IN_RELEASE}"

      - name: 预检 (X11 硬解栈选路 + 预编译包可用性)
        env:
          ABOARD_IN: ${{ steps.args.outputs.board }}
          REL_IN: ${{ steps.args.outputs.release }}
          DE_IN: ${{ steps.args.outputs.desktop }}
        run: |
          set -uo pipefail
          # 注意：workflow 的板卡目录名 ≠ armbian 的 BOARD（h96s 目录里是 h96-m9.csc），
          # 必须用 args 步骤从 build.env 解析出来的真实 BOARD
          ABOARD="${ABOARD_IN}"
          # 板卡描述文件可能是 .csc（社区板）也可能是 .conf（官方/半官方，如 am60-sa12.conf）
          CSC=""
          for ext in csc conf; do
            if [ -f "armbian-build/config/boards/${ABOARD}.${ext}" ]; then
              CSC="armbian-build/config/boards/${ABOARD}.${ext}"
              break
            fi
          done
          FAMILY=$(sed -n 's/^BOARDFAMILY=//p' "${CSC:-/dev/null}" 2>/dev/null | tr -d '"' | head -1)
          FAMILY="${FAMILY:-unknown}"
          REL="${REL_IN}"
          DE="${DE_IN}"

          echo "板卡=${ABOARD} 家族=${FAMILY} 发行版=${REL} 桌面=${DE}"

          VENDOR_RK=0
          case "${FAMILY}" in
            rk35xx|rockchip-rk3588) VENDOR_RK=1 ;;
          esac

          if [ "${VENDOR_RK}" != "1" ]; then
            echo "::warning::${FAMILY} 不是 rk35xx/rockchip-rk3588 家族，rkmpp-mpv / chromium-rkmpp 都不会启用（无厂商 rkmpp 驱动）"
            exit 0
          fi

          # 硬解能力矩阵（两个扩展都启用，各自按发行版自动让位）
          echo "::notice::硬解栈: mpv=rkmpp-mpv(自编译/X11 零拷贝) + 网页=chromium-rkmpp(PPA, 仅 jammy|noble)"
          case "${REL}" in
            noble)
              echo "::notice::noble: 本地 4K 零拷贝(mpv) + 网页硬解(chromium 132+rkmpp) 同镜像，出厂即生效"
              ;;
            jammy)
              echo "::warning::jammy: 网页硬解可用(chromium 126+rkmpp)，但 libplacebo 4.x 编不出 mpv 0.41 -> 本镜像无 mpv 硬解；两者都要请改 release=noble"
              ;;
            trixie)
              echo "::warning::trixie: 只有 mpv 硬解；Debian 侧 chromium 无 V4L2 VDA patch（硬解死路），网页视频仍是软解"
              ;;
            bookworm | bullseye)
              echo "::warning::${REL} 自带 libplacebo < 6.338.2（mpv 0.41 硬依赖），自编译 mpv 会中止构建。请改 trixie|noble。"
              ;;
          esac
          if [ "${REL}" != "trixie" ] && [ "${REL}" != "jammy" ]; then
            echo "::warning::预编译 deb 的 build-info 写死 DISTRO_CODENAME=trixie，目标 ${REL} 会被判定跨发行版 -> 回退 chroot 源码编译 mpp+rga+ffmpeg+mpv，qemu 放大后极易撞 6h 上限。想要稳妥请改 release=trixie（或确认跑在 ubuntu-24.04-arm 原生 runner 上）。"
          fi

      - name: 构建摘要
        env:
          S_BOARD: ${{ inputs.board }}
          S_REL: ${{ steps.args.outputs.release }}
          S_BRANCH: ${{ steps.args.outputs.branch }}
          S_DESKTOP: ${{ steps.args.outputs.desktop }}
          S_TIER: ${{ inputs.desktop_tier }}
          S_USER: ${{ inputs.user_name }}
          S_NOPASS: ${{ inputs.sudo_nopasswd }}
          S_AUTOLOGIN: ${{ inputs.desktop_autologin }}
          S_RPROMPT: ${{ inputs.root_password != '' && '(已设置)' || '(不修改)' }}
          S_CHINESE: ${{ inputs.chinese }}
          S_EXT: ${{ steps.args.outputs.extensions }}
          S_COMPRESS: ${{ inputs.compress }}
          S_MODE: ${{ inputs.kernel_uboot_mode }}
          S_TAG: ${{ inputs.cache_tag }}
          S_ARGS: ${{ steps.args.outputs.args }}
        run: |
          # 全部走 env：这里是无引号 heredoc，原样内插 inputs.*（user_name 等自由文本）
          # 会被 shell 二次展开，`$(…)` 就地执行。
          BASELINE="${S_TAG}"; [ -n "${S_TAG}" ] || BASELINE="最新"
          cat <<EOF
          ┌────────────────────────────────────────────────┐
            X11 定制版
            板卡        : ${S_BOARD}
            发行版      : ${S_REL}   (分支 ${S_BRANCH})
            桌面        : ${S_DESKTOP} / 档位 ${S_TIER}
            默认用户    : ${S_USER}   (sudo免密=${S_NOPASS}, 自动登录=${S_AUTOLOGIN})
            root 密码   : ${S_RPROMPT}
            中文环境    : ${S_CHINESE}
            网页硬解    : chromium-rkmpp（PPA，出厂即 +rkmpp 版；仅 jammy/noble 有效）
            扩展        : ${S_EXT}
            压缩        : ${S_COMPRESS}
          构件模式    : ${S_MODE}   历史基线: ${BASELINE}
          ────────────────────────────────────────────────
          最终参数: ${S_ARGS}
          EOF

      - name: 编译镜像
        env:
          RK_STRICT_ARGS: ${{ inputs.kernel_uboot_mode == 'fresh-strict' && 'ARTIFACT_IGNORE_CACHE=yes' || '' }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
          BUILD_COMPRESS: ${{ steps.args.outputs.compress }}
          # 用户设置：非敏感项走 env；⚠️【口令一律不走 env】——
          # compile.sh 的 sudo --preserve-env 白名单会把它们丢掉（env 通道在 CI 里本就无效），
          # 同时 SHARE_LOG=yes 的构建日志/失败 artifact 不受 GitHub 掩码保护，留一份 env 就多一份明文。
          # 口令唯一通道 = 前面写的 userpatches/.default-user.env 与 .rk-cn-pass.env（0600，读后即删）。
          DEFAULT_USER_NAME: ${{ inputs.user_name }}
          DEFAULT_USER_GROUPS: ${{ inputs.user_groups }}
          DEFAULT_USER_SHELL: /bin/bash
          DEFAULT_SUDO_NOPASSWD: ${{ inputs.sudo_nopasswd && 'yes' || 'no' }}
          DEFAULT_DESKTOP_AUTOLOGIN: ${{ inputs.desktop_autologin && 'yes' || 'no' }}
          DEFAULT_DESKTOP_SESSION_TYPE: x11
          # rk35xx-chinese-desktop 用同一套用户设置，避免两处用户不一致
          RK_CN_USER: ${{ inputs.user_name }}
          RK_CN_IME: auto
        # 编译步骤单独限时，留出 job 收尾（构件检查 / 产物上传 / 日志上传）的时间预算
        timeout-minutes: 320
        run: |
          cd armbian-build
          ./compile.sh \
            ${BUILD_ARGS} \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            COMPRESS_OUTPUTIMAGE=${BUILD_COMPRESS} \
            ${RK_STRICT_ARGS} \
            build

      # 双保险：扩展读后已自删；这里兜住「扩展没跑到/编译中途失败」的残留
      - name: 清理用户凭据文件 (无论成败)
        if: always()
        run: rm -f armbian-build/userpatches/.default-user.env armbian-build/userpatches/.rk-cn-pass.env && echo "凭据文件已清理"

      - name: 检查可保存的构件
        id: cache-payload
        if: ${{ success() && inputs.save_cache }}
        run: |
          set -euo pipefail
          DEBS=no; ROOTFS=no
          [ -d armbian-build/output/debs ] && [ -n "$(ls -A armbian-build/output/debs 2>/dev/null)" ] && DEBS=yes
          [ -d armbian-build/cache/rootfs ] && [ -n "$(ls -A armbian-build/cache/rootfs 2>/dev/null)" ] && ROOTFS=yes
          echo "debs=${DEBS}" >> "$GITHUB_OUTPUT"
          echo "rootfs=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "待保存构件: debs=${DEBS} rootfs=${ROOTFS}"

      - name: 保存 kernel/u-boot debs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.debs == 'yes' && (inputs.kernel_uboot_mode != 'reuse' || steps.debs-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_save }}

      - name: 保存 rootfs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.rootfs == 'yes' && steps.rootfs-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_save }}

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ inputs.board }}-x11-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 90

      - name: 发布镜像到 GitHub Releases
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_NAME: ${{ inputs.board }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
          USER_NAME: ${{ inputs.user_name }}
          S_DESKTOP: ${{ steps.args.outputs.desktop }}
          S_AUTOLOGIN: ${{ inputs.desktop_autologin }}
          S_CHINESE: ${{ inputs.chinese }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="${BOARD_NAME}-x11-${DATE_TAG}-r${GITHUB_RUN_NUMBER}"
          IMG_DIR="armbian-build/output/images"

          ASSETS=()
          shopt -s nullglob
          for f in "${IMG_DIR}"/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 2147483648 ]; then
              echo "::warning::$(basename "$f") 超过 2GiB, 不进 Release (仅 Artifacts)"
              continue
            fi
            ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::没有可发布的镜像文件"; exit 1
          fi

          SHAS=""
          for f in "${ASSETS[@]}"; do
            case "$f" in *.img*) SHAS+="$(basename "$f")  $(awk '{print $1}' "$f.sha" 2>/dev/null || sha256sum "$f" | awk '{print $1}')\n" ;; esac
          done

          NOTES="## Armbian 镜像（X11 定制版） — ${BOARD_NAME}

          | 项 | 值 |
          |---|---|
          | 板卡 | ${BOARD_NAME} |
          | 桌面 | X11 / ${S_DESKTOP} |
          | 默认用户 | \`${USER_NAME}\` |
          | 桌面自动登录 | ${S_AUTOLOGIN} |
          | 中文环境 | ${S_CHINESE} |
          | 构建参数 | \`${BUILD_ARGS}\` |
          | 构建时间 (UTC) | $(date -u '+%Y-%m-%d %H:%M') |

          > 密码在构建日志与 Release 说明里均不体现；以你填写的工作流参数为准。

          ### 烧写
          \`\`\`bash
          xzcat *.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          \`\`\`

          ### 校验
          \`\`\`
          ${SHAS}
          \`\`\`
          [构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在, 覆盖资产"
            gh release upload "${TAG}" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Armbian ${BOARD_NAME} X11 ${DATE_TAG} #${GITHUB_RUN_NUMBER}" \
              --notes "${NOTES}"
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.board }}-x11-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 90
