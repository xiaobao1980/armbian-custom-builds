# CM3588-NAS：让 3.5mm 耳机（RT5616）成为默认输出设备
#
# 版本说明（重要）：
#   本文件是 SPA-JSON 格式，只对 **WirePlumber 0.5+** 生效（Debian 13 trixie 起）。
#   0.4.x（Ubuntu 24.04 noble / Debian 12 bookworm）用的是
#   /etc/wireplumber/main.lua.d/51-rt5616-default.lua —— 那份是 Lua 格式。
#   两份共存互不影响：0.4 只认 Lua，0.5 只认 .conf，各自读自己那份。
#
# 位置说明：
#   放 /usr/share/wireplumber/wireplumber.conf.d/ 而不是 /etc/wireplumber/，
#   是因为 0.5 要求主配置文件 wireplumber.conf 与 conf.d 同级，
#   系统包已经提供了 /usr/share/wireplumber/wireplumber.conf，
#   这里只加片段最稳妥（不用自己维护一份主配置，避免系统更新后过时）。
#
# 背景：板上有 hdmi0 / hdmi1 / dp0 / rt5616 四个 sink，
#       WirePlumber 默认挑 HDMI0，桌面声音全走 HDMI，3.5mm 没声。

monitor.alsa.rules = [
  {
    # 3.5mm 耳机：提优先级 + 起个能认出来的名字
    matches = [
      { node.name = "~alsa_output.platform-rt5616-sound*" }
    ]
    actions = {
      update-props = {
        node.description = "3.5mm 耳机 (RT5616)"
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }
  {
    # HDMI 输出：压低优先级（matches 里多个对象是 AND，所以拆成两条规则表示 OR）
    matches = [
      { node.name = "~alsa_output.platform-hdmi*-sound*" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI 数字输出"
        priority.session = 900
      }
    }
  }
  {
    # DP 输出：同上
    matches = [
      { node.name = "~alsa_output.platform-dp*-sound*" }
    ]
    actions = {
      update-props = {
        node.description = "DP 数字输出"
        priority.session = 900
      }
    }
  }
]
