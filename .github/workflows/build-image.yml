name: Build Armbian Image (单板)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "板卡"
        type: choice
        required: true
        default: h96s
        options:
          - aio-3288c
          - h96-m9
          - h96s
          - am60-sa12
          - neardi-lz200
      branch:
        description: "KERNEL 分支覆盖 (留空 = 用板卡 build.env 默认)"
        required: false
        default: ""
        type: string
      release:
        description: "发行版覆盖 noble/bookworm/trixie (留空 = 默认)"
        required: false
        default: ""
        type: string
      desktop:
        description: "BUILD_DESKTOP 覆盖 (留空 = 默认)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "yes"
          - "no"
      desktop_environment:
        description: "DESKTOP_ENVIRONMENT 覆盖 (gnome/xfce/... 留空 = 默认；armhf 板只能用 xfce/cinnamon/mate/i3-wm/enlightenment)"
        required: false
        default: ""
        type: string
      desktop_tier:
        description: "DESKTOP_TIER 覆盖 (minimal/mid/full, 留空 = 默认)"
        required: false
        default: ""
        type: string
      build_ref:
        description: "armbian/build 引用 (分支/标签, 主线是 main; master 是旧分支)"
        required: false
        default: "main"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (构建需要 ~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Clone armbian/build (${{ inputs.build_ref }})
        run: |
          git clone --depth=1 --branch "${{ inputs.build_ref }}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件 (仅该板卡, 互不干扰)
        run: bash scripts/sync-board-to-build.sh "${{ inputs.board }}" armbian-build

      - name: 组装构建参数 (build.env 默认 + 手动覆盖)
        id: args
        run: |
          set -a
          # shellcheck disable=SC1091
          source "boards/${{ inputs.board }}/build.env"
          set +a
          # 手动输入优先, 留空则用 build.env 默认
          BRANCH="${BRANCH}"; RELEASE="${RELEASE}"; DESKTOP="${BUILD_DESKTOP}"
          if [ -n "${{ inputs.branch }}" ]; then BRANCH="${{ inputs.branch }}"; fi
          if [ -n "${{ inputs.release }}" ]; then RELEASE="${{ inputs.release }}"; fi
          if [ -n "${{ inputs.desktop }}" ]; then DESKTOP="${{ inputs.desktop }}"; fi
          ARGS="BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} BUILD_DESKTOP=${DESKTOP} BUILD_MINIMAL=${BUILD_MINIMAL}"
          # 扩展: 为空则不传, 避免覆盖板卡 csc 里可能已有的 ENABLE_EXTENSIONS
          if [ -n "${ENABLE_EXTENSIONS:-}" ]; then ARGS="${ARGS} ENABLE_EXTENSIONS=${ENABLE_EXTENSIONS}"; fi
          # 桌面环境/档位: BUILD_DESKTOP=yes 时必须显式给出, 否则 armbian 会弹
          # dialog 选桌面(Choose a desktop environment) 和档位(Choose desktop tier),
          # CI 无 TTY → "stdin is not a terminal. can't use dialog" → 退 43。
          DE="${DESKTOP_ENVIRONMENT:-}"; TIER="${DESKTOP_TIER:-}"
          if [ -n "${{ inputs.desktop_environment }}" ]; then DE="${{ inputs.desktop_environment }}"; fi
          if [ -n "${{ inputs.desktop_tier }}" ]; then TIER="${{ inputs.desktop_tier }}"; fi
          if [ "${DESKTOP}" = "yes" ]; then
            if [ -z "${DE}" ]; then echo "::error::BUILD_DESKTOP=yes 但 DESKTOP_ENVIRONMENT 为空"; exit 1; fi
            ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DE}"
            if [ -n "${TIER}" ]; then ARGS="${ARGS} DESKTOP_TIER=${TIER}"; fi
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "构建参数: ${ARGS}"

      - name: 编译镜像
        run: |
          cd armbian-build
          # main 分支的 CLI (entrypoint.sh + commands.sh) 参数顺序任意;
          # 但保持"KEY=VALUE 在前, 目标命令 build 在后"的可读写法。
          # EXPERT=yes 跳过社区板(.csc)的交互确认。
          ./compile.sh \
            ${{ steps.args.outputs.args }} \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            DOWNLOAD_MIRROR=china \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            build

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ inputs.board }}-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*.xz
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.board }}-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 14
