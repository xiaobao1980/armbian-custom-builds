name: Build All Boards (矩阵)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "armbian/build 引用 (分支/标签, 主线是 main; master 是旧分支)"
        required: false
        default: "main"
        type: string
      boards:
        description: "参与构建的板卡 (逗号分隔, 留空 = 全部)"
        required: false
        default: ""
        type: string
      kernel_uboot_mode:
        description: "内核 + U-Boot 构件来源 (reuse=复用历史已编译 debs; fresh=不用历史 debs, 源码全新编译, rootfs 仍复用; fresh-strict=连 rootfs/远程 OCI 也全部禁用, 最慢)"
        type: choice
        required: false
        default: reuse
        options:
          - reuse
          - fresh
          - fresh-strict

      cache_tag:
        description: "指定历史缓存基线: 填构建 run number (Release 里的 r17 -> 填 17); 留空 = 自动选最新一次"
        type: string
        required: false
        default: ""

      save_cache:
        description: "把本次编译产物存成新的历史基线 (供以后 reuse / cache_tag 选用)"
        type: boolean
        required: false
        default: true

      publish_release:
        description: "构建成功后发布到 GitHub Releases (每板卡一个 tag)"
        required: false
        default: true
        type: boolean

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.gen.outputs.boards }}
    steps:
      - id: gen
        run: |
          ALL='["aio-3288c","h96s","am60-sa12","neardi-lz200"]'
          IN="${{ inputs.boards }}"
          if [ -n "$IN" ]; then
            echo "boards=$(echo "$IN" | tr ',' '\n' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          else
            echo "boards=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write    # 发布 Release 需要
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.matrix.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 注册 QEMU binfmt (跨架构 arm64 构建必需)
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "原生 arm64 runner, 无需 qemu binfmt"; exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt 2>/dev/null || true
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          if ! ls /proc/sys/fs/binfmt_misc/ | grep -qi 'aarch64'; then
            echo "apt 注册失败, 改用 tonistiigi/binfmt 兜底"
            docker run --privileged --rm tonistiigi/binfmt --install arm64,arm
          fi
          echo "--- binfmt_misc 已注册:"; ls /proc/sys/fs/binfmt_misc/

      - name: Clone armbian/build (${{ inputs.build_ref }})
        run: |
          git clone --depth=1 --branch "${{ inputs.build_ref }}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件
        run: bash scripts/sync-board-to-build.sh "${{ matrix.board }}" armbian-build

      - name: 计算构件缓存键 (kernel/u-boot 与 rootfs 分离)
        id: cache-key
        env:
          IN_BOARD: ${{ matrix.board }}
          IN_KIND: standard
          IN_REF: ${{ inputs.build_ref }}
          IN_TAG: ${{ inputs.cache_tag }}
          KU_HASH: ${{ hashFiles(format('boards/{0}/userpatches/kernel/**', matrix.board), format('boards/{0}/userpatches/u-boot/**', matrix.board), format('boards/{0}/config/**', matrix.board), format('boards/{0}/build.env', matrix.board)) }}
          ROOTFS_HASH: ${{ hashFiles('common/extensions/**', 'scripts/**', format('boards/{0}/userpatches/overlay/**', matrix.board)) }}
        run: |
          set -euo pipefail
          [[ "${IN_TAG}" =~ ^[0-9]+$ || -z "${IN_TAG}" ]] \
            || { echo "::error::cache_tag 只能是构建 run number (纯数字), 收到 '${IN_TAG}'"; exit 1; }
          REF="${IN_REF//\//_}"
          PREFIX="armbian-all"
          DEBS_BASE="${PREFIX}-debs-${IN_BOARD}-${IN_KIND}-${REF}-${KU_HASH}-v2"
          ROOTFS_BASE="${PREFIX}-rootfs-${IN_BOARD}-${IN_KIND}-${REF}-${ROOTFS_HASH}-v2"
          SUFFIX="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          if [ -n "${IN_TAG}" ]; then
            DEBS_RESTORE="${DEBS_BASE}-r${IN_TAG}-a1"
            ROOTFS_RESTORE="${ROOTFS_BASE}-r${IN_TAG}-a1"
          else
            DEBS_RESTORE="${DEBS_BASE}-auto"
            ROOTFS_RESTORE="${ROOTFS_BASE}-auto"
          fi
          {
            echo "debs_restore=${DEBS_RESTORE}"
            echo "debs_save=${DEBS_BASE}-${SUFFIX}"
            echo "rootfs_restore=${ROOTFS_RESTORE}"
            echo "rootfs_save=${ROOTFS_BASE}-${SUFFIX}"
            echo "tag=${IN_TAG}"
            echo "debs_restore_keys<<DEBS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${DEBS_BASE}-r${IN_TAG}-"; fi
            echo "${DEBS_BASE}-"
            echo "DEBS_EOF"
            echo "rootfs_restore_keys<<ROOTFS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${ROOTFS_BASE}-r${IN_TAG}-"; fi
            echo "${ROOTFS_BASE}-"
            echo "ROOTFS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "kernel/u-boot 缓存基线: ${DEBS_BASE}-"
          echo "rootfs 缓存基线       : ${ROOTFS_BASE}-"
          echo "本次保存为            : ...-${SUFFIX}  (以后 cache_tag 填 ${GITHUB_RUN_NUMBER} 即可精确复用)"

      - name: 恢复历史 kernel/u-boot debs (reuse 模式)
        id: debs-cache
        if: ${{ inputs.kernel_uboot_mode == 'reuse' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.debs_restore_keys }}

      - name: 恢复 rootfs 缓存
        id: rootfs-cache
        if: ${{ inputs.kernel_uboot_mode != 'fresh-strict' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.rootfs_restore_keys }}

      - name: 校验指定的历史缓存基线
        if: ${{ inputs.cache_tag != '' }}
        env:
          IN_TAG: ${{ inputs.cache_tag }}
          DEBS_MATCHED: ${{ steps.debs-cache.outputs.cache-matched-key }}
          ROOTFS_MATCHED: ${{ steps.rootfs-cache.outputs.cache-matched-key }}
          MODE: ${{ inputs.kernel_uboot_mode }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "reuse" ] && [[ "${DEBS_MATCHED}" != *"-r${IN_TAG}-"* ]]; then
            echo "::error::指定的历史基线 r${IN_TAG} 未命中 (实际: ${DEBS_MATCHED:-无})。请留空 cache_tag 用自动最新，或从以往构建日志里挑一个真实的 run number。"
            exit 1
          fi
          echo "历史基线 r${IN_TAG}: debs='${DEBS_MATCHED:-未恢复(fresh)}' rootfs='${ROOTFS_MATCHED:-无}'"

      - name: "全新编译模式: 清空历史 kernel/u-boot debs"
        if: ${{ inputs.kernel_uboot_mode != 'reuse' }}
        run: |
          set -euo pipefail
          mkdir -p armbian-build/output/debs
          n=$(find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f | wc -l)
          find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f -delete
          echo "::notice::已跳过历史 debs 缓存并清空 ${n} 个文件, kernel/u-boot 将从源码编译"
          if [ "${{ inputs.kernel_uboot_mode }}" = "fresh-strict" ]; then
            echo "::notice::fresh-strict: 额外传 ARTIFACT_IGNORE_CACHE=yes, 连 rootfs 与远程 OCI 缓存也全部禁用 (最慢)"
          else
            echo "::notice::fresh: rootfs 缓存仍复用, 只有 kernel/u-boot 全新编译"
          fi

      - name: 组装构建参数
        id: args
        run: |
          # shellcheck disable=SC1091
          source "boards/${{ matrix.board }}/build.env"
          ARGS="BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE} BUILD_DESKTOP=${BUILD_DESKTOP} BUILD_MINIMAL=${BUILD_MINIMAL}"
          if [ -n "${ENABLE_EXTENSIONS:-}" ]; then ARGS="${ARGS} ENABLE_EXTENSIONS=${ENABLE_EXTENSIONS}"; fi
          # BUILD_DESKTOP=yes 必须显式给桌面环境和档位, 否则弹 dialog(无 TTY 直接挂)
          if [ "${BUILD_DESKTOP}" = "yes" ]; then
            if [ -z "${DESKTOP_ENVIRONMENT:-}" ]; then echo "::error::BUILD_DESKTOP=yes 但 DESKTOP_ENVIRONMENT 为空"; exit 1; fi
            ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DESKTOP_ENVIRONMENT}"
            # 优化: GitHub 6h runner 时限下, 桌面档位强制 base (减 rootfs 装包时间), 覆盖 build.env 里的 mid
            ARGS="${ARGS} DESKTOP_TIER=base"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "构建参数: ${ARGS}"

      - name: 编译镜像
        env:
          RK_STRICT_ARGS: ${{ inputs.kernel_uboot_mode == 'fresh-strict' && 'ARTIFACT_IGNORE_CACHE=yes' || '' }}
        run: |
          cd armbian-build
          # main 分支 CLI 参数顺序任意, 保持 KEY=VALUE 在前更可读
          ./compile.sh \
            ${{ steps.args.outputs.args }} \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            ${RK_STRICT_ARGS} \
            build

      - name: 检查可保存的构件
        id: cache-payload
        if: ${{ success() && inputs.save_cache }}
        run: |
          set -euo pipefail
          DEBS=no; ROOTFS=no
          [ -d armbian-build/output/debs ] && [ -n "$(ls -A armbian-build/output/debs 2>/dev/null)" ] && DEBS=yes
          [ -d armbian-build/cache/rootfs ] && [ -n "$(ls -A armbian-build/cache/rootfs 2>/dev/null)" ] && ROOTFS=yes
          echo "debs=${DEBS}" >> "$GITHUB_OUTPUT"
          echo "rootfs=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "待保存构件: debs=${DEBS} rootfs=${ROOTFS}"

      - name: 保存 kernel/u-boot debs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.debs == 'yes' && (inputs.kernel_uboot_mode != 'reuse' || steps.debs-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_save }}

      - name: 保存 rootfs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.rootfs == 'yes' && steps.rootfs-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_save }}

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*.xz
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 90

      - name: 发布镜像到 GitHub Releases
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_NAME: ${{ matrix.board }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
        run: |
          set -euo pipefail
          # 版本保留: tag 带 run 号, 每次构建独立 Release, 所有版本镜像都保留
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="${BOARD_NAME}-${DATE_TAG}-r${GITHUB_RUN_NUMBER}"
          IMG_DIR="armbian-build/output/images"

          # GitHub Release 单文件上限 2GiB; 超限文件仅留在 Artifacts
          ASSETS=()
          shopt -s nullglob
          for f in "${IMG_DIR}"/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 2147483648 ]; then
              echo "::warning::$(basename "$f") $(numfmt --to=iec "$sz") 超过 2GiB, 不进 Release (仅 Artifacts)"
              continue
            fi
            ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::没有可发布的镜像文件"
            exit 1
          fi

          SHAS=""
          for f in "${ASSETS[@]}"; do
            case "$f" in *.img*) SHAS+="$(basename "$f")  $(awk '{print $1}' "$f.sha" 2>/dev/null || sha256sum "$f" | awk '{print $1}')\n" ;; esac
          done

          NOTES="## Armbian 镜像 — ${BOARD_NAME}

          | 项 | 值 |
          |---|---|
          | 板卡 | ${BOARD_NAME} |
          | 构建参数 | \`${BUILD_ARGS}\` |
          | armbian/build 引用 | ${{ inputs.build_ref }} |
          | 构建时间 (UTC) | $(date -u '+%Y-%m-%d %H:%M') |

          ### 烧写
          \`\`\`bash
          xzcat *.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          # 或 balenaEtcher 直接烧 .img.xz
          \`\`\`

          ### 校验
          \`\`\`
          ${SHAS}
          \`\`\`
          [构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在 (rerun 同号), 覆盖资产"
            gh release upload "${TAG}" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Armbian ${BOARD_NAME} ${DATE_TAG} #${GITHUB_RUN_NUMBER}" \
              --notes "${NOTES}"
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 90
