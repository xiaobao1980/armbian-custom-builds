Syntax 3

SectionUseCase."HiFi" {
	File "/Rockchip/rk3588-rt5616/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# BootSequence / FixedBootSequence 在声卡打开时自动执行，
# 用来把 RT5616 内部那些复位后为 off 的开关一次性打开。
# 说明：设备树里的 simple-audio-card,routing 只声明了 DAPM 通路拓扑，
#       DAPM 不会替你翻转 kcontrol（mixer switch），必须靠这里。
BootSequence [
	# DAC 输入源 = I2S（INF1）
	cset "name='DAC MIXL INF1 Switch' on"
	cset "name='DAC MIXR INF1 Switch' on"
	cset "name='Stereo DAC MIXL DAC L1 Switch' on"
	cset "name='Stereo DAC MIXR DAC R1 Switch' on"

	# DAC1 音量 0dB（max = 175）
	cset "name='DAC1 Playback Volume' 175"

	# 耳机通路： DAC1 -> HPO MIX -> HPVOL -> HP
	# HPO MIX DAC1 是最关键的一条，复位后为 off，不开必然无声
	cset "name='HPO MIX DAC1 Switch' on"
	cset "name='HPO MIX HPVOL Switch' on"
	cset "name='HPVOL Playback Switch' on"
	cset "name='HP Playback Switch' on"
	cset "name='HP Playback Volume' 31"
]
