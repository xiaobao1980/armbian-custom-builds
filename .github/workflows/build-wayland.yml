name: Build Armbian Image (Wayland 定制版)

# =============================================================================
#  Wayland 定制版 —— 与 build-image.yml（标准版）、build-x11.yml（X11 定制版）并存
# -----------------------------------------------------------------------------
#  固定策略（评测点，不可覆盖）：
#    · 桌面必须是支持 Wayland 的会话：gnome / kde-plasma / budgie
#    · 网页硬解走 chromium-rkmpp（rockchip-multimedia PPA + pin1002 + chromium 132/126+rkmpp）。
#      ⚠️ 该 PPA 只发布 jammy / noble —— trixie/bookworm 上该扩展会自动跳过、
#      镜像里没有网页硬解；默认放行（allow_no_hwdec=true）以便出纯桌面/中文镜像。
#    · mesa 运行时 / panthor-gpu overlay / PPA 基础多媒体包由 armbian 主线的
#      armbian-configng module_desktops 在 rootfs 装配期完成（上游 2026-05-09 已把
#      旧 extensions/mesa-vpu.sh 的这部分职责迁过去并删除该扩展）；本仓只补它没做的
#      「出厂即把 chromium 换成 +rkmpp 版」这一步，见 common/extensions/chromium-rkmpp.sh。
#    · 中文环境对所有发行版默认开启（jammy/noble 走 language-pack-*；
#      trixie/bookworm 走 locales-all + 发行版自带翻译 + Noto CJK + AccountsService 会话语言）
#    · 显示管理器按 Wayland 会话配置（gdm3 → WaylandEnable=true，rkmpp-mpv 扩展检测到
#      RKMPP_MPV_SESSION=wayland 后会跳过 WaylandEnable=false，不破坏 Wayland 会话）
#    · 启用 rkmpp-mpv：mpv 二进制同时带 x11/wayland 后端，rkmpp 硬件解码在 Wayland 下同样
#      生效（vo=gpu 自动选 wayland 上下文；CMA=512M 由扩展兜底写入 armbianEnv.txt）
#  可配置：板卡 / 发行版 / 桌面 / 默认用户（用户名·密码·root 密码·附加组·
#          sudo 免密·桌面自动登录）/ 中文环境 / 压缩格式 / runner / 是否发 Release
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      board:
        description: "板卡 (仅 rk35xx / rockchip-rk3588 家族; aio-3288c 是 armhf 无 rkmpp, 请用 X11 定制版)"
        type: choice
        required: true
        default: h96s
        options:
          - h96s
          - neardi-lz200
          - am60-sa12

      release:
        description: "发行版 (Wayland 硬解栈 PPA 只支持 jammy/noble; default=跟随板卡)"
        type: choice
        required: false
        default: default
        options:
          - default
          - noble
          - jammy
          - trixie
          - bookworm

      desktop_environment:
        description: "Wayland 桌面环境"
        type: choice
        required: false
        default: gnome
        options:
          - gnome
          - kde-plasma
          - budgie

      desktop_tier:
        description: "桌面软件档位 (minimal=仅桌面 / mid=+浏览器媒体 / full=+办公开发)"
        type: choice
        required: false
        default: mid
        options:
          - minimal
          - mid
          - full

      user_name:
        description: "默认用户名 (小写字母/数字/下划线/连字符; 留空=不创建默认用户)"
        type: string
        required: false
        default: xiaobao

      user_password:
        description: "默认用户密码 (仅允许 A-Za-z0-9 . _ + # = : @ % -，4~64 位)"
        type: string
        required: false
        default: "123456"

      root_password:
        description: "root 密码 (留空=不改 root 密码; 字符集同用户密码)"
        type: string
        required: false
        default: "123456789"

      user_groups:
        description: "附加组 (逗号分隔, 不存在的组自动跳过)"
        type: string
        required: false
        default: "sudo,adm,audio,video,plugdev,netdev,render,input,dialout,cdrom"

      sudo_nopasswd:
        description: "该用户 sudo 免密"
        type: boolean
        required: false
        default: true

      desktop_autologin:
        description: "桌面自动登录该用户 (烧卡后开机直接进 Wayland 桌面)"
        type: boolean
        required: false
        default: true

      chinese:
        description: "中文环境 (所有发行版默认开启: locale/时区/字体/输入法/Chromium 中文化/AccountsService 会话语言)"
        type: boolean
        required: false
        default: true

      allow_no_hwdec:
        description: "无硬解栈的发行版也继续构建 (默认开启, 便于 trixie/bookworm 出中文桌面镜像; 关闭则遇到无硬解发行版直接中止)"
        type: boolean
        required: false
        default: true

      compress:
        description: "镜像压缩格式"
        type: choice
        required: false
        default: xz
        options:
          - xz
          - 7z
          - none

      build_ref:
        description: "armbian/build 引用 (分支/标签; 主线是 main)"
        type: string
        required: false
        default: "main"

      runner:
        description: "运行器 (arm64 板选 ubuntu-24.04-arm 可原生编译, 免 qemu 且更快)"
        type: choice
        required: false
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest

      kernel_uboot_mode:
        description: "内核 + U-Boot 构件来源 (reuse=复用历史已编译 debs; fresh=不用历史 debs, 源码全新编译, rootfs 仍复用; fresh-strict=连 rootfs/远程 OCI 也全部禁用, 最慢)"
        type: choice
        required: false
        default: reuse
        options:
          - reuse
          - fresh
          - fresh-strict

      cache_tag:
        description: "指定历史缓存基线: 填构建 run number (Release 里的 r17 -> 填 17); 留空 = 自动选最新一次"
        type: string
        required: false
        default: ""

      save_cache:
        description: "把本次编译产物存成新的历史基线 (供以后 reuse / cache_tag 选用)"
        type: boolean
        required: false
        default: true

      publish_release:
        description: "构建成功后发布到 GitHub Releases"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须最先执行：GitHub 会在每个 step 开头回显 env，而 add-mask 只有在
      # 「值已经带掩码」之后才生效。这里从事件载荷里取密码（不进 run 脚本文本、
      # 不进 env 回显），立刻加掩码，后续所有 step 的 env 回显都会显示成 ***。
      - name: 注册密码掩码 (先于任何 env 回显, 避免明文进日志)
        run: |
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; return 0; }
          if [ -r "${GITHUB_EVENT_PATH:-/dev/null}" ] && command -v jq >/dev/null 2>&1; then
            mask "$(jq -r '.inputs.user_password // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            mask "$(jq -r '.inputs.root_password // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          fi
          echo "密码掩码已注册"

      - name: Free disk space (构建需要 ~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 注册 QEMU binfmt (跨架构 arm64/armhf 构建必需)
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ] && [ "${{ inputs.board }}" != "aio-3288c" ]; then
            echo "原生 arm64 runner + arm64 目标, 无需 qemu binfmt"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt 2>/dev/null || true
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          if ! ls /proc/sys/fs/binfmt_misc/ | grep -qi 'aarch64'; then
            echo "apt 注册失败, 改用 tonistiigi/binfmt 兜底"
            docker run --privileged --rm tonistiigi/binfmt --install arm64,arm
          fi
          ls /proc/sys/fs/binfmt_misc/

      - name: Clone armbian/build (${{ inputs.build_ref }})
        run: |
          git clone --depth=1 --branch "${{ inputs.build_ref }}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件 (仅该板卡, 互不干扰)
        run: bash scripts/sync-board-to-build.sh "${{ inputs.board }}" armbian-build

      - name: 预拉 rkmpp-stack 预编译包 (避免 CI 6h 上限内编不完)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          D="armbian-build/userpatches/extensions/rkmpp-mpv/prebuilt"
          mkdir -p "$D"
          if command -v gh >/dev/null 2>&1; then
            OK=0
            # 顺序：当前发行版专用包优先（noble 走 wayland 版），再回退通用 trixie 包
            for TAG in rkmpp-stack-v0.41.0-noble-arm64 rkmpp-stack-v0.41.0-2 rkmpp-stack-v0.41.0-1; do
              if gh release download "$TAG" --repo "$GH_REPO" \
                   --pattern 'rkmpp-stack_*_arm64.deb' --dir "$D"; then
                echo "预编译包已就位（$TAG）:"; ls -lh "$D"; OK=1; break
              fi
              echo "::notice::$TAG 不可用，尝试下一个 tag"
            done
            if [ "$OK" != "1" ]; then
              echo "::warning::预编译包下载失败, rkmpp-mpv 扩展将回退源码编译(可能撞 6h 上限)"
            fi
          else
            echo "::warning::无 gh CLI, rkmpp-mpv 扩展将回退源码编译"
          fi

      - name: 计算构件缓存键 (kernel/u-boot 与 rootfs 分离)
        id: cache-key
        env:
          IN_BOARD: ${{ inputs.board }}
          IN_REL: ${{ inputs.release }}
          IN_DE: ${{ inputs.desktop_environment }}
          IN_TIER: ${{ inputs.desktop_tier }}
          IN_REF: ${{ inputs.build_ref }}
          IN_TAG: ${{ inputs.cache_tag }}
          KU_HASH: ${{ hashFiles(format('boards/{0}/userpatches/kernel/**', inputs.board), format('boards/{0}/userpatches/u-boot/**', inputs.board), format('boards/{0}/config/**', inputs.board), format('boards/{0}/build.env', inputs.board)) }}
          ROOTFS_HASH: ${{ hashFiles('common/extensions/**', 'scripts/**', format('boards/{0}/userpatches/overlay/**', inputs.board)) }}
        run: |
          set -euo pipefail
          [[ "${IN_TAG}" =~ ^[0-9]+$ || -z "${IN_TAG}" ]] \
            || { echo "::error::cache_tag 只能是构建 run number (纯数字), 收到 '${IN_TAG}'"; exit 1; }
          REF="${IN_REF//\//_}"
          PREFIX="armbian-wayland"
          DEBS_BASE="${PREFIX}-debs-${IN_BOARD}-${IN_REL}-${IN_DE}-${REF}-${KU_HASH}-v2"
          ROOTFS_BASE="${PREFIX}-rootfs-${IN_BOARD}-${IN_REL}-${IN_DE}-${IN_TIER}-${REF}-${ROOTFS_HASH}-v2"
          SUFFIX="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          if [ -n "${IN_TAG}" ]; then
            DEBS_RESTORE="${DEBS_BASE}-r${IN_TAG}-a1"
            ROOTFS_RESTORE="${ROOTFS_BASE}-r${IN_TAG}-a1"
          else
            DEBS_RESTORE="${DEBS_BASE}-auto"
            ROOTFS_RESTORE="${ROOTFS_BASE}-auto"
          fi
          {
            echo "debs_restore=${DEBS_RESTORE}"
            echo "debs_save=${DEBS_BASE}-${SUFFIX}"
            echo "rootfs_restore=${ROOTFS_RESTORE}"
            echo "rootfs_save=${ROOTFS_BASE}-${SUFFIX}"
            echo "tag=${IN_TAG}"
            echo "debs_restore_keys<<DEBS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${DEBS_BASE}-r${IN_TAG}-"; fi
            echo "${DEBS_BASE}-"
            echo "DEBS_EOF"
            echo "rootfs_restore_keys<<ROOTFS_EOF"
            if [ -n "${IN_TAG}" ]; then echo "${ROOTFS_BASE}-r${IN_TAG}-"; fi
            echo "${ROOTFS_BASE}-"
            echo "ROOTFS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "kernel/u-boot 缓存基线: ${DEBS_BASE}-"
          echo "rootfs 缓存基线       : ${ROOTFS_BASE}-"
          echo "本次保存为            : ...-${SUFFIX}  (以后 cache_tag 填 ${GITHUB_RUN_NUMBER} 即可精确复用)"

      - name: 恢复历史 kernel/u-boot debs (reuse 模式)
        id: debs-cache
        if: ${{ inputs.kernel_uboot_mode == 'reuse' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.debs_restore_keys }}

      - name: 恢复 rootfs 缓存
        id: rootfs-cache
        if: ${{ inputs.kernel_uboot_mode != 'fresh-strict' }}
        uses: actions/cache/restore@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_restore }}
          restore-keys: ${{ steps.cache-key.outputs.rootfs_restore_keys }}

      - name: 校验指定的历史缓存基线
        if: ${{ inputs.cache_tag != '' }}
        env:
          IN_TAG: ${{ inputs.cache_tag }}
          DEBS_MATCHED: ${{ steps.debs-cache.outputs.cache-matched-key }}
          ROOTFS_MATCHED: ${{ steps.rootfs-cache.outputs.cache-matched-key }}
          MODE: ${{ inputs.kernel_uboot_mode }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "reuse" ] && [[ "${DEBS_MATCHED}" != *"-r${IN_TAG}-"* ]]; then
            echo "::error::指定的历史基线 r${IN_TAG} 未命中 (实际: ${DEBS_MATCHED:-无})。请留空 cache_tag 用自动最新，或从以往构建日志里挑一个真实的 run number。"
            exit 1
          fi
          echo "历史基线 r${IN_TAG}: debs='${DEBS_MATCHED:-未恢复(fresh)}' rootfs='${ROOTFS_MATCHED:-无}'"

      - name: "全新编译模式: 清空历史 kernel/u-boot debs"
        if: ${{ inputs.kernel_uboot_mode != 'reuse' }}
        run: |
          set -euo pipefail
          mkdir -p armbian-build/output/debs
          n=$(find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f | wc -l)
          find armbian-build/output/debs -mindepth 1 -maxdepth 2 -type f -delete
          echo "::notice::已跳过历史 debs 缓存并清空 ${n} 个文件, kernel/u-boot 将从源码编译"
          if [ "${{ inputs.kernel_uboot_mode }}" = "fresh-strict" ]; then
            echo "::notice::fresh-strict: 额外传 ARTIFACT_IGNORE_CACHE=yes, 连 rootfs 与远程 OCI 缓存也全部禁用 (最慢)"
          else
            echo "::notice::fresh: rootfs 缓存仍复用, 只有 kernel/u-boot 全新编译"
          fi

      - name: 校验用户设置 + 组装构建参数
        id: args
        env:
          IN_BOARD: ${{ inputs.board }}
          IN_REL: ${{ inputs.release }}
          IN_DE: ${{ inputs.desktop_environment }}
          IN_TIER: ${{ inputs.desktop_tier }}
          IN_USER: ${{ inputs.user_name }}
          IN_UPASS: ${{ inputs.user_password }}
          IN_RPASS: ${{ inputs.root_password }}
          IN_GROUPS: ${{ inputs.user_groups }}
          IN_CHINESE: ${{ inputs.chinese }}
          IN_COMPRESS: ${{ inputs.compress }}
        run: |
          set -euo pipefail

          BE="boards/${IN_BOARD}/build.env"
          [ -f "$BE" ] || { echo "::error::找不到 $BE"; exit 1; }
          set -a; source "$BE"; set +a

          echo "::add-mask::${IN_UPASS}"
          [ -n "${IN_RPASS}" ] && echo "::add-mask::${IN_RPASS}" || true

          if [ -n "${IN_USER}" ]; then
            [[ "${IN_USER}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] \
              || { echo "::error::user_name 非法: '${IN_USER}'（要求 ^[a-z_][a-z0-9_-]{0,31}$）"; exit 1; }
            case "${IN_USER}" in
              root|daemon|bin|sys|nobody|admin) echo "::error::user_name '${IN_USER}' 是系统保留名"; exit 1 ;;
            esac
            [[ "${IN_UPASS}" =~ ^[A-Za-z0-9._+#=:@%-]{4,64}$ ]] \
              || { echo "::error::user_password 字符集受限（只允许 A-Za-z0-9 . _ + # = : @ % -，4~64 位）"; exit 1; }
          fi
          if [ -n "${IN_RPASS}" ]; then
            [[ "${IN_RPASS}" =~ ^[A-Za-z0-9._+#=:@%-]{4,64}$ ]] \
              || { echo "::error::root_password 字符集受限（同 user_password 规则）"; exit 1; }
          fi
          if [ -n "${IN_GROUPS}" ]; then
            [[ "${IN_GROUPS}" =~ ^[A-Za-z0-9_,]*$ ]] \
              || { echo "::error::user_groups 非法（只允许字母数字下划线与逗号）"; exit 1; }
          fi

          pick() { [ -n "$2" ] && [ "$2" != "default" ] && printf '%s' "$2" || printf '%s' "$1"; }
          REL_FINAL="$(pick "${RELEASE}" "${IN_REL}")"
          DE_FINAL="${IN_DE}"
          TIER_FINAL="${IN_TIER}"
          BRANCH_FINAL="${BRANCH}"

          # Wayland 版：chromium-rkmpp + rkmpp-mpv（同一份 mpv 二进制同时带 x11/wayland
          # 后端，rkmpp 在 Wayland 下同样生效；扩展内部按 RKMPP_MPV_SESSION=wayland
          # 跳过 WaylandEnable=false，不会把 Wayland 镜像变成 X11）。
          EXT=""
          add_ext() { case ",${EXT}," in *",$1,"*) ;; *) EXT="${EXT:+${EXT},}$1" ;; esac; }
          [ -n "${IN_USER}" ] && add_ext default-user
          [ "${IN_CHINESE}" = "true" ] && add_ext rk35xx-chinese-desktop
          add_ext chromium-rkmpp
          add_ext rkmpp-mpv
          # 兜底补 display-manager.service：chroot 里 deb-systemd-helper 只建 .wants，
          # 不建这个 Alias → gdm 路线会停在文字控制台（187 实测，见扩展头注释）
          add_ext desktop-dm
          # 蓝牙音频设备开机自动回连（BlueZ 不会主动连 A2DP/HFP，188 板冷启动实测）
          add_ext bluetooth-autoconnect
          # 每次开机强制 NTP 校时（无 RTC 电池板上电时间归零，chrony/timesyncd 渐进同步不够）
          add_ext ntp-boot-sync

          # 通知 rkmpp-mpv 扩展：这是 Wayland 镜像（文件通道，规避 sudo 环境白名单丢变量）。
          mkdir -p armbian-build/userpatches
          echo "RKMPP_MPV_SESSION=wayland" > armbian-build/userpatches/.rkmpp-mpv.env

          case "${IN_COMPRESS}" in
            7z)   COMPRESS="sha,img,7z" ;;
            none) COMPRESS="sha,img"    ;;
            *)    COMPRESS="sha,img,xz" ;;
          esac

          ARGS="BOARD=${BOARD} BRANCH=${BRANCH_FINAL} RELEASE=${REL_FINAL}"
          ARGS="${ARGS} BUILD_DESKTOP=yes BUILD_MINIMAL=no"
          ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DE_FINAL} DESKTOP_TIER=${TIER_FINAL}"
          ARGS="${ARGS} ENABLE_EXTENSIONS=${EXT}"
          # default-user 在 chroot 里 useradd -m 建的家目录，会被框架的
          # create_image_from_sdcard_rootfs 用 --exclude="/home/*" 丢掉
          # （lib/functions/image/rootfs-to-image.sh:38），镜像里只剩空 /home，
          # 用户能自动登录但 $HOME 不存在（profile-sync-daemon / 语言保存全失败）。
          # 显式 INCLUDE_HOME_DIR=yes 才会把 /home/<user> 连同 /etc/skel 打进镜像。
          ARGS="${ARGS} INCLUDE_HOME_DIR=yes"

          {
            echo "args=${ARGS}"
            echo "board=${BOARD}"
            echo "compress=${COMPRESS}"
            echo "release=${REL_FINAL}"
            echo "desktop=${DE_FINAL}"
            echo "branch=${BRANCH_FINAL}"
            echo "extensions=${EXT}"
          } >> "$GITHUB_OUTPUT"

          echo "构建参数: ${ARGS}"

      # 为什么要单独写文件：compile.sh 以非 root 启动时会 `exec sudo --preserve-env
      # <白名单>` 重启自己（lib/functions/cli/utils-cli.sh），普通 env 全被丢弃 ——
      # 只靠 step 的 env: 传 DEFAULT_USER_NAME，扩展读到时是空的，会静默跳过建用户。
      # 文件通道不进 CLI 参数（不污染日志/进程列表），扩展读取后立刻删除。
      - name: 准备构建期用户凭据 (文件通道, 规避 sudo 环境白名单)
        # 扩展以 DEFAULT_USER_NAME 为总开关：没有用户名时连 root 密码也不处理，故这里同条件
        if: ${{ inputs.user_name != '' }}
        env:
          IN_USER: ${{ inputs.user_name }}
          IN_UPASS: ${{ inputs.user_password }}
          IN_RPASS: ${{ inputs.root_password }}
          IN_GROUPS: ${{ inputs.user_groups }}
          IN_NOPASSWD: ${{ inputs.sudo_nopasswd }}
          IN_AUTOLOGIN: ${{ inputs.desktop_autologin }}
        run: |
          set -euo pipefail
          DEST="armbian-build/userpatches/.default-user.env"
          mkdir -p "$(dirname "${DEST}")"
          umask 077
          : > "${DEST}"
          {
            printf 'DEFAULT_USER_NAME=%q\n' "${IN_USER}"
            printf 'DEFAULT_USER_PASSWORD=%q\n' "${IN_UPASS}"
            printf 'DEFAULT_USER_SHELL=%q\n' "/bin/bash"
            printf 'DEFAULT_DESKTOP_SESSION_TYPE=%q\n' "wayland"
            if [ "${IN_NOPASSWD}" = "true" ]; then
              printf 'DEFAULT_SUDO_NOPASSWD=%q\n' "yes"
            else
              printf 'DEFAULT_SUDO_NOPASSWD=%q\n' "no"
            fi
            if [ "${IN_AUTOLOGIN}" = "true" ]; then
              printf 'DEFAULT_DESKTOP_AUTOLOGIN=%q\n' "yes"
            else
              printf 'DEFAULT_DESKTOP_AUTOLOGIN=%q\n' "no"
            fi
            if [ -n "${IN_GROUPS}" ]; then
              printf 'DEFAULT_USER_GROUPS=%q\n' "${IN_GROUPS}"
            fi
            if [ -n "${IN_RPASS}" ]; then
              printf 'DEFAULT_ROOT_PASSWORD=%q\n' "${IN_RPASS}"
            fi
          } >> "${DEST}"
          chmod 600 "${DEST}"
          echo "::notice::用户凭据已写入 userpatches/.default-user.env (0600)，扩展读取后即删除"

      - name: 预检 (Wayland 硬解栈可用性)
        run: |
          set -uo pipefail
          # 注意：workflow 的板卡目录名 ≠ armbian 的 BOARD（h96s 目录里是 h96-m9.csc），
          # 必须用 args 步骤从 build.env 解析出来的真实 BOARD
          ABOARD="${{ steps.args.outputs.board }}"
          # 板卡描述文件可能是 .csc（社区板）也可能是 .conf（官方/半官方，如 am60-sa12.conf）
          CSC=""
          for ext in csc conf; do
            if [ -f "armbian-build/config/boards/${ABOARD}.${ext}" ]; then
              CSC="armbian-build/config/boards/${ABOARD}.${ext}"
              break
            fi
          done
          FAMILY=$(sed -n 's/^BOARDFAMILY=//p' "${CSC:-/dev/null}" 2>/dev/null | tr -d '"' | head -1)
          FAMILY="${FAMILY:-unknown}"
          REL="${{ steps.args.outputs.release }}"
          DE="${{ steps.args.outputs.desktop }}"

          echo "板卡=${ABOARD} 家族=${FAMILY} 发行版=${REL} 桌面=${DE}"

          case "${FAMILY}" in
            rk35xx|rockchip-rk3588) ;;
            *)
              echo "::error::${FAMILY} 不是 rk35xx/rockchip-rk3588 家族：chromium-rkmpp 与 configng 的 rockchip-multimedia / panthor-gpu 都要求厂商内核。请改用标准版或 X11 定制版。"
              exit 1
              ;;
          esac

          # chromium+rkmpp 只在 PPA 的 jammy/noble；其余发行版该扩展自动跳过 -> 无网页硬解
          case "${REL}" in
            noble)
              echo "硬解栈: configng(PPA+panthor) + chromium-rkmpp（chromium 132+rkmpp，出厂即硬解）"
              ;;
            jammy)
              echo "硬解栈: chromium-rkmpp（chromium 126+rkmpp；jammy 无 panthor overlay，GPU 走发行版 mesa）"
              ;;
            *)
              if [ "${{ inputs.allow_no_hwdec }}" = "true" ]; then
                echo "::warning::${REL} 上 chromium-rkmpp 会自动跳过（PPA 只发布 jammy/noble）—— 本镜像**不含网页硬解**，但桌面/中文环境/输入法完整可用。"
              else
                echo "::error::${REL} 上没有网页硬解路径：chromium-rkmpp 的 PPA 只发布 jammy/noble。请把 release 改成 noble（或 jammy）；若只要桌面+中文环境，请保持 allow_no_hwdec 开启（默认已开启）。"
                exit 1
              fi
              ;;
          esac

          # 中文环境：所有发行版默认生效（Ubuntu 走 language-pack-*，Debian 走 locales-all + 自带翻译）
          if [ "${{ inputs.chinese }}" = "true" ]; then
            echo "中文环境: 开启（${REL}，Ubuntu/Debian 自适应，含 AccountsService 会话语言）"
          else
            echo "中文环境: 关闭（镜像为英文界面）"
          fi

          case "${DE}" in
            gnome | kde-plasma | budgie) ;;
            *) echo "::warning::${DE} 不是 Wayland 优先桌面，自动登录可能落到 X11 会话" ;;
          esac

      - name: 构建摘要
        run: |
          cat <<EOF
          ┌────────────────────────────────────────────────┐
            Wayland 定制版
            板卡        : ${{ inputs.board }}
            发行版      : ${{ steps.args.outputs.release }}   (分支 ${{ steps.args.outputs.branch }})
            桌面        : ${{ steps.args.outputs.desktop }} / 档位 ${{ inputs.desktop_tier }}
            默认用户    : ${{ inputs.user_name }}   (sudo免密=${{ inputs.sudo_nopasswd }}, 自动登录=${{ inputs.desktop_autologin }})
            中文环境    : ${{ inputs.chinese }}   (所有发行版默认开启)
            扩展        : ${{ steps.args.outputs.extensions }}
            压缩        : ${{ inputs.compress }}
          构件模式    : ${{ inputs.kernel_uboot_mode }}   历史基线: ${{ inputs.cache_tag == '' && '最新' || inputs.cache_tag }}
          ────────────────────────────────────────────────
          最终参数: ${{ steps.args.outputs.args }}
          EOF

      - name: 编译镜像
        env:
          RK_STRICT_ARGS: ${{ inputs.kernel_uboot_mode == 'fresh-strict' && 'ARTIFACT_IGNORE_CACHE=yes' || '' }}
          DEFAULT_USER_NAME: ${{ inputs.user_name }}
          DEFAULT_USER_PASSWORD: ${{ inputs.user_password }}
          DEFAULT_ROOT_PASSWORD: ${{ inputs.root_password }}
          DEFAULT_USER_GROUPS: ${{ inputs.user_groups }}
          DEFAULT_USER_SHELL: /bin/bash
          DEFAULT_SUDO_NOPASSWD: ${{ inputs.sudo_nopasswd && 'yes' || 'no' }}
          DEFAULT_DESKTOP_AUTOLOGIN: ${{ inputs.desktop_autologin && 'yes' || 'no' }}
          DEFAULT_DESKTOP_SESSION_TYPE: wayland
          RK_CN_USER: ${{ inputs.user_name }}
          RK_CN_USER_PASS: ${{ inputs.user_password }}
          RK_CN_ROOT_PASS: ${{ inputs.root_password }}
          RK_CN_IME: auto
        run: |
          cd armbian-build
          ./compile.sh \
            ${{ steps.args.outputs.args }} \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            COMPRESS_OUTPUTIMAGE=${{ steps.args.outputs.compress }} \
            ${RK_STRICT_ARGS} \
            build

      # 双保险：扩展读后已自删；这里兜住「扩展没跑到/编译中途失败」的残留
      - name: 清理用户凭据文件 (无论成败)
        if: always()
        run: rm -f armbian-build/userpatches/.default-user.env && echo "凭据文件已清理"

      - name: 检查可保存的构件
        id: cache-payload
        if: ${{ success() && inputs.save_cache }}
        run: |
          set -euo pipefail
          DEBS=no; ROOTFS=no
          [ -d armbian-build/output/debs ] && [ -n "$(ls -A armbian-build/output/debs 2>/dev/null)" ] && DEBS=yes
          [ -d armbian-build/cache/rootfs ] && [ -n "$(ls -A armbian-build/cache/rootfs 2>/dev/null)" ] && ROOTFS=yes
          echo "debs=${DEBS}" >> "$GITHUB_OUTPUT"
          echo "rootfs=${ROOTFS}" >> "$GITHUB_OUTPUT"
          echo "待保存构件: debs=${DEBS} rootfs=${ROOTFS}"

      - name: 保存 kernel/u-boot debs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.debs == 'yes' && (inputs.kernel_uboot_mode != 'reuse' || steps.debs-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/output/debs
          key: ${{ steps.cache-key.outputs.debs_save }}

      - name: 保存 rootfs 为新历史基线
        if: ${{ success() && inputs.save_cache && steps.cache-payload.outputs.rootfs == 'yes' && steps.rootfs-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: armbian-build/cache/rootfs
          key: ${{ steps.cache-key.outputs.rootfs_save }}

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ inputs.board }}-wayland-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 90

      - name: 发布镜像到 GitHub Releases
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_NAME: ${{ inputs.board }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
          USER_NAME: ${{ inputs.user_name }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="${BOARD_NAME}-wayland-${DATE_TAG}-r${GITHUB_RUN_NUMBER}"
          IMG_DIR="armbian-build/output/images"

          ASSETS=()
          shopt -s nullglob
          for f in "${IMG_DIR}"/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 2147483648 ]; then
              echo "::warning::$(basename "$f") 超过 2GiB, 不进 Release (仅 Artifacts)"
              continue
            fi
            ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::没有可发布的镜像文件"; exit 1
          fi

          SHAS=""
          for f in "${ASSETS[@]}"; do
            case "$f" in *.img*) SHAS+="$(basename "$f")  $(awk '{print $1}' "$f.sha" 2>/dev/null || sha256sum "$f" | awk '{print $1}')\n" ;; esac
          done

          NOTES="## Armbian 镜像（Wayland 定制版） — ${BOARD_NAME}

          | 项 | 值 |
          |---|---|
          | 板卡 | ${BOARD_NAME} |
          | 桌面 | Wayland / ${{ steps.args.outputs.desktop }} |
          | 默认用户 | \`${USER_NAME}\` |
          | 桌面自动登录 | ${{ inputs.desktop_autologin }} |
          | 中文环境 | ${{ inputs.chinese }} |
          | 硬解栈 | chromium-rkmpp（chromium 132/126+rkmpp，仅 jammy/noble 有效）+ configng mesa/panthor |
          | 构建参数 | \`${BUILD_ARGS}\` |
          | 构建时间 (UTC) | $(date -u '+%Y-%m-%d %H:%M') |

          > 密码在构建日志与 Release 说明里均不体现；以你填写的工作流参数为准。

          ### 烧写
          \`\`\`bash
          xzcat *.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          \`\`\`

          ### 校验
          \`\`\`
          ${SHAS}
          \`\`\`
          [构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在, 覆盖资产"
            gh release upload "${TAG}" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Armbian ${BOARD_NAME} Wayland ${DATE_TAG} #${GITHUB_RUN_NUMBER}" \
              --notes "${NOTES}"
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.board }}-wayland-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 90
