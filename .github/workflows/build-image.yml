name: Build Armbian Image (单板)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "板卡"
        type: choice
        required: true
        default: h96s
        options:
          - aio-3288c
          - h96-m9
          - h96s
          - am60-sa12
          - neardi-lz200

      edition:
        description: "镜像类型 (server=纯命令行 / minimal=精简命令行 / desktop=带桌面)"
        type: choice
        required: true
        default: default
        options:
          - default
          - desktop
          - server
          - minimal

      desktop_environment:
        description: "桌面环境 (仅 desktop 有效; default=用板卡默认; armhf 板只有 xfce/cinnamon/mate/lxqt/i3-wm 可用)"
        type: choice
        required: false
        default: default
        options:
          - default
          - gnome
          - xfce
          - kde-plasma
          - cinnamon
          - mate
          - lxqt
          - i3-wm
          - budgie

      desktop_tier:
        description: "桌面软件档位 (minimal=仅桌面 / mid=+浏览器媒体 / full=+办公开发)"
        type: choice
        required: false
        default: default
        options:
          - default
          - minimal
          - mid
          - full

      kernel_branch:
        description: "内核分支 (vendor=厂商 BSP / current / edge / legacy; default=用板卡默认)"
        type: choice
        required: false
        default: default
        options:
          - default
          - vendor
          - current
          - edge
          - legacy

      kernel_version:
        description: "内核版本 (高级可选, 如 6.1.172; 留空=跟随分支最新; 必须是内核仓库里存在的 tag v<版本>)"
        type: string
        required: false
        default: ""

      release:
        description: "发行版"
        type: choice
        required: false
        default: default
        options:
          - default
          - noble
          - bookworm
          - trixie
          - jammy
          - resolute

      compress:
        description: "镜像压缩格式"
        type: choice
        required: false
        default: xz
        options:
          - xz
          - 7z
          - none

      build_ref:
        description: "armbian/build 引用 (分支/标签; 主线是 main, master 是旧分支)"
        type: string
        required: false
        default: "main"

      runner:
        description: "运行器 (arm64 板选 ubuntu-24.04-arm 可原生编译, 免 qemu 且更快; x86 runner 会装 qemu binfmt)"
        type: choice
        required: false
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm

      publish_release:
        description: "构建成功后发布到 GitHub Releases (类似 ophub/amlogic-s9xxx-armbian 的 Releases 页)"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: write    # 发布 Release 需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (构建需要 ~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          toolchain: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 注册 QEMU binfmt (跨架构 arm64 构建必需)
        run: |
          set -euo pipefail
          # x86 runner 上构建 arm64 镜像, armbian 会在 rootfs 阶段 chroot 进 arm64,
          # 需要 binfmt_misc + qemu-aarch64-static; 否则挂在这里:
          #   [error] Failed to update binfmts update-binfmts --enable qemu-aarch64
          #   [error] arch-test: arm64: not supported on this machine/kernel
          if [ "$(uname -m)" = "aarch64" ]; then
            echo "原生 arm64 runner, 无需 qemu binfmt"
            exit 0
          fi
          sudo apt-get update -qq
          # qemu-user-static 自带带 F(fix-binary) 标志的注册项, 容器内也能用
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt 2>/dev/null || true
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          if ! ls /proc/sys/fs/binfmt_misc/ | grep -qi 'aarch64'; then
            echo "apt 注册失败, 改用 tonistiigi/binfmt 兜底"
            docker run --privileged --rm tonistiigi/binfmt --install arm64,arm
          fi
          echo "--- binfmt_misc 已注册:"
          ls /proc/sys/fs/binfmt_misc/
          grep -h '^enabled\|^disabled' /proc/sys/fs/binfmt_misc/qemu-aarch64 || true

      - name: Clone armbian/build (${{ inputs.build_ref }})
        run: |
          git clone --depth=1 --branch "${{ inputs.build_ref }}" \
            https://github.com/armbian/build armbian-build

      - name: 同步板卡自定义文件 (仅该板卡, 互不干扰)
        run: bash scripts/sync-board-to-build.sh "${{ inputs.board }}" armbian-build

      - name: 组装构建参数 (build.env 默认 + 下拉覆盖)
        id: args
        env:
          BOARD_NAME: ${{ inputs.board }}
          IN_EDITION: ${{ inputs.edition }}
          IN_DE: ${{ inputs.desktop_environment }}
          IN_TIER: ${{ inputs.desktop_tier }}
          IN_KB: ${{ inputs.kernel_branch }}
          IN_KV: ${{ inputs.kernel_version }}
          IN_REL: ${{ inputs.release }}
          IN_COMPRESS: ${{ inputs.compress }}
        run: |
          set -euo pipefail

          # ---- 1. 板卡默认值 ----
          # shellcheck disable=SC1091
          set -a; source "boards/${BOARD_NAME}/build.env"; set +a

          BOARD_DEF="${BOARD}"; BRANCH_DEF="${BRANCH}"; RELEASE_DEF="${RELEASE}"
          DE_DEF="${DESKTOP_ENVIRONMENT:-}"; TIER_DEF="${DESKTOP_TIER:-}"
          if   [ "${BUILD_DESKTOP}" = "yes" ]; then EDITION_DEF=desktop
          elif [ "${BUILD_MINIMAL}" = "yes" ]; then EDITION_DEF=minimal
          else                                      EDITION_DEF=server; fi

          # ---- 2. 合并用户选择 (default = 跟随板卡) ----
          pick() { [ -n "$2" ] && [ "$2" != "default" ] && printf '%s' "$2" || printf '%s' "$1"; }
          EDITION="$(pick "${EDITION_DEF}" "${IN_EDITION}")"
          DE="$(pick "${DE_DEF}" "${IN_DE}")"
          TIER="$(pick "${TIER_DEF:-mid}" "${IN_TIER}")"
          BRANCH="$(pick "${BRANCH_DEF}" "${IN_KB}")"
          RELEASE="$(pick "${RELEASE_DEF}" "${IN_REL}")"

          # ---- 3. edition -> BUILD_DESKTOP / BUILD_MINIMAL ----
          case "${EDITION}" in
            desktop) BUILD_DESKTOP=yes; BUILD_MINIMAL=no  ;;
            minimal) BUILD_DESKTOP=no;  BUILD_MINIMAL=yes ;;
            *)       BUILD_DESKTOP=no;  BUILD_MINIMAL=no  ;;
          esac

          # ---- 4. 桌面环境必填校验 + 架构兼容性校验 ----
          if [ "${BUILD_DESKTOP}" = "yes" ]; then
            if [ -z "${DE}" ]; then
              echo "::error::edition=desktop 但 desktop_environment 为空(板卡 build.env 也没配)"
              exit 1
            fi
            # 从板卡 csc 取 BOARDFAMILY, 再从家族配置取 ARCH (rk3288=rk35xx 家族等)
            FAMILY=$(sed -n 's/^BOARDFAMILY=//p' "armbian-build/config/boards/${BOARD}.csc" | tr -d '"' | head -1)
            ARCH=$(sed -n 's/^ARCH=//p' "armbian-build/config/sources/families/${FAMILY}.conf" 2>/dev/null | tr -d '"' | head -1)
            ARCH="${ARCH:-arm64}"
            case "${ARCH}:${DE}" in
              armhf:gnome|armhf:kde-plasma|armhf:budgie)
                echo "::error::${DE} 不支持 ${ARCH} (板卡 ${BOARD} / 家族 ${FAMILY}); 请改选 xfce / cinnamon / mate / lxqt / i3-wm"
                exit 1 ;;
            esac
            echo "桌面: ${DE} / 档位 ${TIER} / 架构 ${ARCH}"
          fi

          # ---- 5. 组装参数串 ----
          ARGS="BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE}"
          ARGS="${ARGS} BUILD_DESKTOP=${BUILD_DESKTOP} BUILD_MINIMAL=${BUILD_MINIMAL}"
          if [ "${BUILD_DESKTOP}" = "yes" ]; then
            ARGS="${ARGS} DESKTOP_ENVIRONMENT=${DE} DESKTOP_TIER=${TIER}"
          fi
          # 扩展: build.env 未设置则不传, 避免覆盖 csc 里已有的 ENABLE_EXTENSIONS
          if [ -n "${ENABLE_EXTENSIONS:-}" ]; then
            ARGS="${ARGS} ENABLE_EXTENSIONS=${ENABLE_EXTENSIONS}"
          fi
          # 内核版本锁定 (高级): tag:v<x.y.z>
          if [ -n "${IN_KV}" ]; then
            ARGS="${ARGS} KERNELBRANCH=tag:v${IN_KV}"
          fi
          # 压缩格式
          case "${IN_COMPRESS}" in
            7z)   COMPRESS="sha,img,7z" ;;
            none) COMPRESS="sha,img"    ;;
            *)    COMPRESS="sha,img,xz" ;;
          esac

          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "compress=${COMPRESS}" >> "$GITHUB_OUTPUT"

      - name: 构建摘要
        run: |
          cat <<EOF
          ┌────────────────────────────────────────────┐
            板卡        : ${{ inputs.board }}
            镜像类型    : ${{ inputs.edition }}   (desktop / server / minimal)
            桌面环境    : ${{ inputs.desktop_environment }}   档位: ${{ inputs.desktop_tier }}
            内核分支    : ${{ inputs.kernel_branch }}   版本锁定: ${{ inputs.kernel_version }}
            发行版      : ${{ inputs.release }}
            压缩格式    : ${{ inputs.compress }}
          ──────────────────────────────────────────────
          最终参数: ${{ steps.args.outputs.args }}
          EOF

      - name: 编译镜像
        run: |
          cd armbian-build
          # main 分支 CLI (entrypoint.sh + commands.sh) 参数顺序任意;
          # 仍保持 "KEY=VALUE 在前, 目标命令 build 在后" 的可读写法。
          # EXPERT=yes 跳过社区板(.csc)的交互确认。
          ./compile.sh \
            ${{ steps.args.outputs.args }} \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            SHARE_LOG=yes \
            DOWNLOAD_MIRROR=china \
            COMPRESS_OUTPUTIMAGE=${{ steps.args.outputs.compress }} \
            build

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ inputs.board }}-${{ inputs.edition }}-${{ github.run_number }}
          path: |
            armbian-build/output/images/**/*.img*
            armbian-build/output/images/**/*.sha
          if-no-files-found: error
          retention-days: 14

      - name: 发布镜像到 GitHub Releases
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_NAME: ${{ inputs.board }}
          EDITION_NAME: ${{ inputs.edition }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d)"
          TAG="${BOARD_NAME}-${DATE_TAG}"
          IMG_DIR="armbian-build/output/images"

          # GitHub Release 单文件上限 2GiB; 超限文件仅留在 Artifacts
          ASSETS=()
          shopt -s nullglob
          for f in "${IMG_DIR}"/*; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 2147483648 ]; then
              echo "::warning::$(basename "$f") $(numfmt --to=iec "$sz") 超过 2GiB, 不进 Release (仅 Artifacts)"
              continue
            fi
            ASSETS+=("$f")
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::没有可发布的镜像文件"
            exit 1
          fi

          # 校验和表
          SHAS=""
          for f in "${ASSETS[@]}"; do
            case "$f" in *.img*) SHAS+="$(basename "$f")  $(awk '{print $1}' "$f.sha" 2>/dev/null || sha256sum "$f" | awk '{print $1}')\n" ;; esac
          done

          NOTES="## Armbian 镜像 — ${BOARD_NAME}

          | 项 | 值 |
          |---|---|
          | 板卡 | ${BOARD_NAME} |
          | 镜像类型 | ${EDITION_NAME} |
          | 构建参数 | \`${BUILD_ARGS}\` |
          | armbian/build 引用 | ${{ inputs.build_ref }} |
          | 构建时间 (UTC) | $(date -u '+%Y-%m-%d %H:%M') |

          ### 烧写
          \`\`\`bash
          xzcat *.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          # 或 balenaEtcher 直接烧 .img.xz
          \`\`\`

          ### 校验
          \`\`\`
          ${SHAS}
          \`\`\`
          [构建日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在, 追加/覆盖资产"
            gh release upload "${TAG}" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Armbian ${BOARD_NAME} ${DATE_TAG}" \
              --notes "${NOTES}"
          fi
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: 上传构建日志 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.board }}-${{ github.run_number }}
          path: armbian-build/output/logs/**
          retention-days: 14
