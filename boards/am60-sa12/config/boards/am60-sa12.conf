# Armbian 官方 rockchip-rk3588 家族板级配置
# 放置：config/boards/am60-sa12.conf
#
# 对应内核（Armbian rockchip-rk3588 家族 BRANCH=vendor 的既有定义，无需自己改）：
#   KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
#   KERNELBRANCH='branch:rk-6.1-rkr7.2'
#   KERNELPATCHDIR='rk35xx-vendor-6.1'
#   LINUXFAMILY=rk35xx
#   BOOTSOURCE='https://github.com/radxa/u-boot.git'
#   BOOTBRANCH='branch:next-dev-v2024.10'      # 2017.09 系 vendor U-Boot，不是主线
#   BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx legacy/u-boot-radxa-rk35xx-v2024.10"
#   BOOTSCRIPT='boot-rk35xx.cmd:boot.cmd'
#   BOOTDIR='u-boot-rockchip64'
#   OVERLAY_PREFIX='rockchip-rk3588'
#
# 构建：
#   ./compile.sh BOARD=am60-sa12 BRANCH=vendor RELEASE=bookworm BUILD_DESKTOP=no
#
# 硬件背景：CVTE SA12 / AM60 是插在 TCL IFP86X60M 上的 80-pin (OPS) 模块。
#           显示经 HDMI0 输出 4K30；触控由屏幕侧提供（当前不工作，见报告）。

# Rockchip RK3588 octa core 8GB RAM eMMC IFP OPS module (80-pin)
BOARD_NAME="AM60 CVTE SA12 OPS"
BOARD_VENDOR="rockchip"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="xiaobao1980"
INTRODUCED="2026"

# Radxa vendor U-Boot defconfig。命名必须让 rk3588 紧贴 "_defconfig"，
# 因为 BOOT_SOC 由 BOOTCONFIG 用正则 '.*\(rk[0-9]+.*\)_.*' 提取。
BOOTCONFIG="am60-sa12-rk3588_defconfig"
BOOT_SOC="rk3588"          # 显式兜底，防止正则抽错
BOOT_SCENARIO="spl-blobs"  # vendor DDR/SPL blob + ATF
BOOT_SUPPORT_SPI="no"      # OPS 模块无 SPI NOR
IMAGE_PARTITION_TABLE="gpt"
BOOT_LOGO="desktop"

KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"

# vendor 内核（rk-6.1-rkr7.2）带 fiq_debugger，串口是 ttyFIQ0，不是 ttyS2
declare -g SERIALCON="ttyFIQ0,ttyGS0"

# DTB 必须来自内核源码树 arch/arm64/boot/dts/rockchip/rk3588-am60-sa12.dts
BOOT_FDT_FILE="rockchip/rk3588-am60-sa12.dtb"

# 无线：AP6275P (BCM43752) 走 PCIe；BT 接在哪个 UART 待测（候选 ttyS6/ttyS8/ttyS9）
# BT_UART="/dev/ttyS6"    # TODO：拿到厂商 DTB 后确认

FULL_DESKTOP="no"

# ---------------------------------------------------------------------------
case "${BRANCH}" in

	vendor)
		# rk-6.1-rkr7.2：厂商 Mali、fiq_debugger、vendor USB/PCIe 行为
		declare -g PACKAGE_LIST_BOARD="rfkill i2c-tools"
		;;

	*)
		# 主线 kernel (current/edge)：fiq_debugger 不存在，串口改回 ttyS2
		display_alert "$BOARD" "主线分支：串口改回 ttyS2" "wrn"
		declare -g SERIALCON="ttyS2"
		declare -g PACKAGE_LIST_BOARD="libubootenv-tool rfkill i2c-tools"
		;;
esac

# ---------------------------------------------------------------------------
# 启动参数
#
# 坑：config/bootscripts/boot-rk35xx.cmd 把串口 console 写死成
#     `console=ttyS2,1500000`（那是主线内核的叫法）。本镜像是 vendor 6.1，
#     内核开了 CONFIG_FIQ_DEBUGGER=y / CONFIG_ROCKCHIP_FIQ_DEBUGGER=y，
#     UART2 被 fiq_debugger 占着，设备名是 **ttyFIQ0**，ttyS2 根本不存在。
#     所以这里用 armbianEnv.txt 的"后写覆盖前写"特性纠正：
#       - console=display  -> 关掉 bootscript 里的 console=ttyS2（只留 tty1）
#       - extraboardargs   -> 补上 console=ttyFIQ0,1500000
#     boot.cmd 里 ${extraboardargs} 排在 ${consoleargs} 之后，
#     最终 bootargs = "... console=tty1 ... console=ttyFIQ0,1500000 ..."。
#
# 注意不要写 extraargs=：family 已经设了 extraargs=cma=256M，
# 同名变量后写覆盖前写，会把 cma 冲掉（影响 VPU/NPU 的连续内存）。
# 所以自己的参数一律走 extraboardargs。
function post_family_tweaks__am60_sa12_bootenv() {
	[[ "${BRANCH}" == "vendor" ]] || return 0
	mkdir -p "${SDCARD}"/boot/
	cat <<- 'BOOTENV' >> "${SDCARD}"/boot/armbianEnv.txt
		usbstoragequirks=2109:0715:u,2109:0713:u,3535:1122:u
		console=display
		extraboardargs=console=ttyFIQ0,1500000 pci=nomsi drm.edid_firmware=HDMI-A-1:edid/am60-ifp.bin,DP-1:edid/am60-ifp-b1.bin,HDMI-B-1:edid/am60-ifp-b1.bin
	BOOTENV
	return 0
}

# 音频口重命名（vendor 内核声卡节点名与主线不同）
function post_family_tweaks__am60_sa12_naming_audios() {
	[[ "${BRANCH}" == "vendor" ]] || return 0
	mkdir -p "${SDCARD}"/etc/udev/rules.d/
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > "${SDCARD}"/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI1 Audio"' >> "${SDCARD}"/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmiin-sound", ENV{SOUND_DESCRIPTION}="HDMI-In Audio"' >> "${SDCARD}"/etc/udev/rules.d/90-naming-audios.rules
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> "${SDCARD}"/etc/udev/rules.d/90-naming-audios.rules
	return 0
}

# ---------------------------------------------------------------------------
# 已知不需要的（厂商 DTS 未使能，开了可能卡启动）：
#   eDP / DSI / PCIe3x4(fe150000) / PCIe3x2(fe160000) / PCIe2x1l1(fe180000)
#   GMAC0(fe1b0000) / GMAC1(fe1c0000)  -> 板载网口不是 GMAC，是 PCIe RTL8168 + USB RTL8152
#   SDIO(fe2d0000)

# ---------------------------------------------------------------------------
# 把 userpatches/overlay/ 里的板级文件真正拷进镜像。
#
# ★坑（Armbian 上游行为，血泪）：userpatches/overlay/ 只是**只读 bind 到 chroot 的
#   /tmp/overlay**（lib/functions/rootfs/customize.sh:30），框架**不会**自动拷进镜像。
#   之前所有板级脚本 / EDID / udev 规则 / gdm 配置 / Type-C 驱动都是靠 ssh 手工推到
#   板子上的，一重刷全丢。必须在 HOST 上下文（${SRC} 与 ${SDCARD} 都可用）显式拷贝。
#
# 只拷 etc / usr / lib / var 四棵树。overlay 根目录那些**构建期辅助脚本**
# （customize-image*.sh、rk-rkmedia-*.sh、common-chinese-desktop.sh、config/）
# 绝不能进镜像——它们是给 chroot 里用的，不是给用户系统的。
function post_family_tweaks__am60_sa12_deploy_overlay() {
	[[ "${BRANCH}" == "vendor" ]] || return 0
	local conf="${SRC}/userpatches/overlay"
	if [[ ! -d "${conf}" ]]; then
		display_alert "${BOARD}" "userpatches/overlay not present - skipping" "wrn"
		return 0
	fi
	display_alert "${BOARD}" "Deploying userpatches/overlay into rootfs" "info"

	# etc / usr / lib：以 root 身份拷，属主归 root，权限沿用源文件
	for d in etc usr lib; do
		[[ -d "${conf}/${d}" ]] && cp -r "${conf}/${d}/." "${SDCARD}/${d}/"
	done

	# var：保留属主（/var/lib/gdm3/.config 必须是 gdm:gdm，否则登录界面不落大屏）
	if [[ "${BUILD_DESKTOP}" == "yes" ]] && [[ -d "${conf}/var" ]]; then
		cp -a "${conf}/var/." "${SDCARD}/var/"
		# gdm 的真实 uid/gid 因发行版/版本而异（本镜像实测 uid=121 gid=125；
		# 旧注释错写成 125:125，导致 .config 属主错乱、gdm 写不进去、登录界面起不来）。
		# 不要写死数字——直接从镜像自己的 /etc/passwd 读 gdm 的真实 uid/gid。
		local GDM_UID GDM_GID
		GDM_UID=$(awk -F: '$1=="gdm"{print $3}' "${SDCARD}/etc/passwd" 2>/dev/null)
		GDM_GID=$(awk -F: '$1=="gdm"{print $4}' "${SDCARD}/etc/passwd" 2>/dev/null)
		[ -z "${GDM_UID}" ] && GDM_UID=121
		[ -z "${GDM_GID}" ] && GDM_GID=125
		chown -R ${GDM_UID}:${GDM_GID} "${SDCARD}"/var/lib/gdm3/.config 2>/dev/null || true
		chmod 0700 "${SDCARD}"/var/lib/gdm3/.config/dconf 2>/dev/null || true
		chmod 0600 "${SDCARD}"/var/lib/gdm3/.config/dconf/user 2>/dev/null || true
		chmod 0644 "${SDCARD}"/var/lib/gdm3/.config/monitors.xml 2>/dev/null || true
	fi

	# 脚本可执行位 + 属主归位（overlay 里有些是 xiaobao 拥有的）
	chown -R root:root "${SDCARD}"/usr/local/sbin "${SDCARD}"/usr/local/bin 2>/dev/null || true
	chmod 0755 "${SDCARD}"/usr/local/sbin/* 2>/dev/null || true
	chmod 0755 "${SDCARD}"/usr/local/bin/* 2>/dev/null || true
	chown -R root:root "${SDCARD}"/etc/skel 2>/dev/null || true
	chmod 0440 "${SDCARD}"/etc/sudoers.d/am60-touchmap 2>/dev/null || true

	# 外部模块 tcpci_et7303.ko 是 overlay 直接放的，内核 deb 的 modules.dep 里没有它，
	# 不 depmod 的话 modules-load.d 里的名字 modprobe 找不到 -> Type-C 不工作。
	chroot "${SDCARD}" /bin/bash -c "depmod -a 6.1.172-vendor-rk35xx" >/dev/null 2>&1 || 		display_alert "${BOARD}" "depmod in chroot failed (non-fatal)" "wrn"

	return 0
}
